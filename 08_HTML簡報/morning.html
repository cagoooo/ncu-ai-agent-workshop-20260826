  <script type="application/json" id="deck-data">{"deck":"morning","title":"上午場｜打造專屬 AI 教學與研究工作室","subtitle":"Gemini Notebook、Gem、Canvas 與網站部署實作","session":"上午場","slides":[{"index":1,"title":"打造專屬 AI 教學與研究工作室：\nGemini Notebook、Gem、Canvas\n與網站部署實作","eyebrow":"上午場","section":"Vibe Coding、Vibe Working 與 AI 三個 Level","notes":"開場先說明：今天的重點不是把所有按鈕看過一遍，而是每位參與者都完成可帶回課堂的成果。邀請大家先選定一門課程，以及一個真實的教學／研究痛點與問題。\n\n提醒：本簡報已全面採用現行名稱「Gemini Notebook」。","text":"國立中央大學｜2026.08.26\n上午場｜09:00–12:00\n打造專屬 AI 教學與研究工作室：\nGemini Notebook、Gem、Canvas\n與網站部署實作\n從 AI 教學與研究助理到 AI Agent｜用 AI 降本增效，讓專業飛得更高更遠\n黃凱揚（阿凱老師）｜桃園市龍潭區石門國小資訊組長｜教學年資第 11 年","description":"開場先說明：今天的重點不是把所有按鈕看過一遍，而是每位參與者都完成可帶回課堂的成果。邀請大家先選定一門課程，以及一個真實的教學／研究痛點與問題。\n\n提醒：本簡報已全面採用現行名稱「Gemini Notebook」。","image":"slides/morning-01.png","links":[],"hotspots":[],"sticker":null},{"index":2,"title":"Vibe Coding：靈感一來，就開始做","eyebrow":"VIBE CODING","section":"Vibe Coding、Vibe Working 與 AI 三個 Level","notes":"Andrej Karpathy 將這種『先跟著靈感走、用自然語言讓 AI 協助把想法做出來』的工作方式稱為 Vibe Coding。這裡把它轉成適合今天社群的學習入口：當你突然想到一個教學活動、研究工具或生活中的小作品，不必先被『我不會寫程式』擋住，可以先把想法說清楚，讓 AI／Agent 協助把它推成第一個可操作原型。\n\n但 Vibe Coding 不是把責任交給模型。要保留人工試用、資料權限、測試與品質判斷；靈感負責啟動，人的目的與驗證負責把作品帶到可用。\n\n[Sources]\n- https://www.youtube.com/watch?v=LCEmiRjPEtQ\n[/Sources]","text":"VIBE CODING\nVibe Coding：靈感一來，就開始做\n上午場｜打造專屬 AI 教學與研究工作室\n02\n01\n一個 vibe\n早上醒來靈光一閃，突然知道想做什麼；先把念頭抓住，不必等自己會寫程式。\n02\n直接說出來\n用自然語言告訴 AI／Agent 目標、對象、限制與期待的成果。\n03\n讓工具接手\nAgent 可以協助寫程式、做介面、串資料與測試，把想法推成可操作的原型。\n04\n人來校準\n試用、提問、修正與驗證，保留目的、品質與責任；靈感不是免除判斷。\nAndrej Karpathy：Vibe Coding ↗","description":"Andrej Karpathy 將這種『先跟著靈感走、用自然語言讓 AI 協助把想法做出來』的工作方式稱為 Vibe Coding。這裡把它轉成適合今天社群的學習入口：當你突然想到一個教學活動、研究工具或生活中的小作品，不必先被『我不會寫程式』擋住，可以先把想法說清楚，讓 AI／Agent 協助把它推成第一個可操作原型。\n\n但 Vibe Coding 不是把責任交給模型。要保留人工試用、資料權限、測試與品質判斷；靈感負責啟動，人的目的與驗證負責把作品帶到可用。\n\n[Sources]\n- https://www.youtube.com/watch?v=LCEmiRjPEtQ\n[/Sources]","image":"slides/morning-02.png","links":[{"label":"Andrej Karpathy：Vibe Coding","url":"https://www.youtube.com/watch?v=LCEmiRjPEtQ"}],"hotspots":[{"kind":"qr","url":"https://www.youtube.com/watch?v=LCEmiRjPEtQ","label":"Andrej Karpathy：Vibe Coding","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://www.youtube.com/watch?v=LCEmiRjPEtQ","label":"Andrej Karpathy：Vibe Coding","x":68.6719,"y":3.75,"w":15.5469,"h":5}],"sticker":null},{"index":3,"title":"從 Vibe Coding 進階到 Vibe Working","eyebrow":"VIBE WORKING","section":"Vibe Coding、Vibe Working 與 AI 三個 Level","notes":"Vibe Working 是本工作坊把 Vibe Coding 延伸到日常工作的課程框架，不把它當成 Andrej Karpathy 的原始名詞。當我們在工作中發現『為什麼人生要一直浪費在這些重複事情上』，那個不滿與靈感就是自動化的入口。\n\n請大家不要只追求做更多，而是把重複流程交給 AI／Agent 後，重新決定省下來的時間要回到哪裡：更好的課程、更扎實的研究、更深的人際互動，或是自己一直想做卻沒有時間做的事。效率的終點不是把行程塞滿，而是重新取得生活的主導權。","text":"VIBE WORKING\n從 Vibe Coding 進階到 Vibe Working\n上午場｜打造專屬 AI 教學與研究工作室\n03\n1\n看見摩擦\n發現工作中一再重複、繁瑣又消耗人的流程。\n→\n2\n捕捉靈感\n想一想：這件事能不能交給 AI 協作或自動化？\n→\n3\n說明工作\n交代對象、資料、規則、限制與完成標準。\n→\n4\n讓 Agent 推進\n從整理、產出到測試，讓工具持續把流程往前推。\n→\n5\n把時間還給人\n省下的時間回到教學、研究、家人、興趣與真正重要的事。\n每一步都留下可檢查的成果\nGemini Notebook ↗  ·  Gemini Canvas ↗","description":"Vibe Working 是本工作坊把 Vibe Coding 延伸到日常工作的課程框架，不把它當成 Andrej Karpathy 的原始名詞。當我們在工作中發現『為什麼人生要一直浪費在這些重複事情上』，那個不滿與靈感就是自動化的入口。\n\n請大家不要只追求做更多，而是把重複流程交給 AI／Agent 後，重新決定省下來的時間要回到哪裡：更好的課程、更扎實的研究、更深的人際互動，或是自己一直想做卻沒有時間做的事。效率的終點不是把行程塞滿，而是重新取得生活的主導權。","image":"slides/morning-03.png","links":[{"label":"Gemini Notebook","url":"https://notebook.google.com/"},{"label":"Gemini Canvas","url":"https://gemini.google.com/app"}],"hotspots":[{"kind":"qr","url":"https://notebook.google.com/","label":"Gemini Notebook","x":81.4063,"y":4.5833,"w":6.5625,"h":11.6667},{"kind":"qr","url":"https://gemini.google.com/app","label":"Gemini Canvas","x":88.5938,"y":4.5833,"w":6.5625,"h":11.6667},{"kind":"platform","url":"https://notebook.google.com/","label":"Gemini Notebook","x":62.0313,"y":3.75,"w":8.9844,"h":5},{"kind":"platform","url":"https://gemini.google.com/app","label":"Gemini Canvas","x":71.6406,"y":3.75,"w":7.8906,"h":5}],"sticker":null},{"index":4,"title":"AI 的三個 Level：從對話到代理","eyebrow":"AI CAPABILITY LEVELS","section":"Vibe Coding、Vibe Working 與 AI 三個 Level","notes":"上午會帶大家從 Level 1 的對話式 AI，進階到 Level 2 的協作式 AI：用 Gemini Notebook、Gem 與 Canvas 一起完成作品。下午再進入 Level 3 的 Agentic AI，讓 Agent 從頭到尾推進任務並交付成果。\n\nLevel 3 不只是『模型比較強』，而是人、工作區、工具、規則與 Skills 組成一個可重複的工作流。你可以把自己的 AI Agent 想成一位長期協作的數位同仁：它會逐漸理解你的工作方式與痛點，但授權範圍、驗證標準與最後責任仍由人保留。\n\n[Sources]\n- https://notebook.google.com/\n- https://gemini.google.com/app\n- https://antigravity.google/\n[/Sources]","text":"AI CAPABILITY LEVELS\nAI 的三個 Level：從對話到代理\n上午場｜打造專屬 AI 教學與研究工作室\n04\nL1\n對話式 AI\n問問題、要解釋、請它發想；人把答案帶回工作，通常仍由人逐步操作。現場平常使用的聊天機器人，多半在這一層。\nL2\n協作式 AI\n把來源、角色與工作區交給 AI，一起整理、比較、設計與修改。Gemini Notebook、Gem 與 Canvas 讓人和 AI 共同產出。\nL3\nAgentic AI／AI 代理人\n交代目標與邊界，讓 Agent 長時間規劃、使用工具、執行與驗證，並透過 Skills 越來越懂你的工作流；人仍在關鍵節點做決策。\nGemini Notebook ↗  ·  Gemini Canvas ↗  ·  Antigravity ↗","description":"上午會帶大家從 Level 1 的對話式 AI，進階到 Level 2 的協作式 AI：用 Gemini Notebook、Gem 與 Canvas 一起完成作品。下午再進入 Level 3 的 Agentic AI，讓 Agent 從頭到尾推進任務並交付成果。\n\nLevel 3 不只是『模型比較強』，而是人、工作區、工具、規則與 Skills 組成一個可重複的工作流。你可以把自己的 AI Agent 想成一位長期協作的數位同仁：它會逐漸理解你的工作方式與痛點，但授權範圍、驗證標準與最後責任仍由人保留。\n\n[Sources]\n- https://notebook.google.com/\n- https://gemini.google.com/app\n- https://antigravity.google/\n[/Sources]","image":"slides/morning-04.png","links":[{"label":"Gemini Notebook","url":"https://notebook.google.com/"},{"label":"Gemini Canvas","url":"https://gemini.google.com/app"},{"label":"Antigravity","url":"https://antigravity.google/"}],"hotspots":[{"kind":"qr","url":"https://notebook.google.com/","label":"Gemini Notebook","x":77.9688,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"qr","url":"https://gemini.google.com/app","label":"Gemini Canvas","x":83.9063,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"qr","url":"https://antigravity.google/","label":"Antigravity","x":89.8438,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"platform","url":"https://notebook.google.com/","label":"Gemini Notebook","x":59.375,"y":3.75,"w":5.8594,"h":5},{"kind":"platform","url":"https://gemini.google.com/app","label":"Gemini Canvas","x":65.8594,"y":3.75,"w":5.1563,"h":5},{"kind":"platform","url":"https://antigravity.google/","label":"Antigravity","x":71.6406,"y":3.75,"w":4.4531,"h":5}],"sticker":null},{"index":5,"title":"文組的 AI 大航海時代","eyebrow":"上午場","section":"建立 AI 教學與研究工作室","notes":"","text":"01\n文組的 AI 大航海時代\nAI 與 Agent 讓文組帶著理解、脈絡與判斷，航向創作藍海。\n多一雙技術翅膀，讓專業飛得更高、更遠，也讓教學研究降本增效。\n動手\n做\n上午場｜打造專屬 AI 教學與研究工作室\n05","description":"上午場｜文組的 AI 大航海時代","image":"slides/morning-05.png","links":[],"hotspots":[],"sticker":null},{"index":6,"title":"多一雙翅膀：不會寫程式，也能做出作品","eyebrow":"AI AS WINGS","section":"建立 AI 教學與研究工作室","notes":"這一頁要讓文組專業者先放下『我不會寫程式，所以做不到』的自我設限。AI 與 Agent 可以協助把語言、想法與需求轉成程式碼、介面、資料流程與可操作作品；就像多了一雙翅膀，像 Red Bull 一樣如虎添翼，讓我們飛得更高、更遠。\n\n但翅膀不是方向。真正要帶進工作坊的，是大家對教學、研究、文本、人的理解，以及對問題的判斷。技術執行可以交給工具協作，目的與最後責任仍由人掌握。","text":"AI AS WINGS\n多一雙翅膀：不會寫程式，也能做出作品\n上午場｜打造專屬 AI 教學與研究工作室\n06\n你帶來的專業\n問題意識與語言\n教學／研究脈絡\n對人的理解與判斷\n目的、責任與界線\nAgent 補上的能力\n把想法拆成程式\n建立介面、資料與流程\n測試、修正、部署\n長時間不中斷地推進","description":"這一頁要讓文組專業者先放下『我不會寫程式，所以做不到』的自我設限。AI 與 Agent 可以協助把語言、想法與需求轉成程式碼、介面、資料流程與可操作作品；就像多了一雙翅膀，像 Red Bull 一樣如虎添翼，讓我們飛得更高、更遠。\n\n但翅膀不是方向。真正要帶進工作坊的，是大家對教學、研究、文本、人的理解，以及對問題的判斷。技術執行可以交給工具協作，目的與最後責任仍由人掌握。","image":"slides/morning-06.png","links":[],"hotspots":[],"sticker":null},{"index":7,"title":"文組的底子，就是 AI 時代的導航能力","eyebrow":"HUMANITIES AS NAVIGATION","section":"建立 AI 教學與研究工作室","notes":"這不是文理對立，而是能力重新組隊。文組長期累積的理解、脈絡、辨識、表達與教育／研究判斷，正是 AI 時代的導航能力；AI 與 Agent 則補上程式、介面、資料與自動化的執行能力。\n\n對今天在場的教授與社群成員來說，大家不是要變成另一種人，而是帶著原本的專業，取得一雙能把專業帶到更遠地方的技術翅膀。","text":"HUMANITIES AS NAVIGATION\n文組的底子，就是 AI 時代的導航能力\n上午場｜打造專屬 AI 教學與研究工作室\n07\n01\n理解人與情境\n讀懂需求、角色、文化與脈絡，知道問題真正發生在哪裡。\n02\n辨識與判斷\n分辨證據、觀點、偏誤與限制，不把工具產出的文字直接當成真理。\n03\n語言與敘事\n把複雜想法說清楚、寫清楚，讓人與 Agent 都能理解下一步。\n04\n教育／研究倫理\n守住目的、關係、隱私與責任，讓作品真的對人有幫助。","description":"這不是文理對立，而是能力重新組隊。文組長期累積的理解、脈絡、辨識、表達與教育／研究判斷，正是 AI 時代的導航能力；AI 與 Agent 則補上程式、介面、資料與自動化的執行能力。\n\n對今天在場的教授與社群成員來說，大家不是要變成另一種人，而是帶著原本的專業，取得一雙能把專業帶到更遠地方的技術翅膀。","image":"slides/morning-07.png","links":[],"hotspots":[],"sticker":null},{"index":8,"title":"大藍海的邀請：帶著你的專業出航","eyebrow":"SET SAIL WITH YOUR EXPERTISE","section":"建立 AI 教學與研究工作室","notes":"請大家把今天想做的事情想成一次出航：先帶上自己的真問題與專業脈絡，再讓 Agent 補上技術翅膀。不是先學會所有工具才開始，而是從一個真實需求開始，讓工具協助我們完成以前以為不可能的事；最後仍由人驗證，並把成果帶回教學、研究與生活。\n\n這也是今天上午的學習弧線：先說清楚，再有根據、有角色、有作品、能分享。等一下請大家帶著這個問題進入實作：如果我真的多了一雙翅膀，想飛去哪裡？","text":"SET SAIL WITH YOUR EXPERTISE\n大藍海的邀請：帶著你的專業出航\n上午場｜打造專屬 AI 教學與研究工作室\n08\n1\n帶上真問題\n從課堂、研究或生活中的一個痛點出發\n→\n2\n說清楚脈絡\n交代對象、情境、限制與想完成的改變\n→\n3\n讓 Agent 執行\n把想法轉成程式、流程、介面與可操作作品\n→\n4\n人來驗證\n檢查內容、證據、權限、倫理與實際使用感受\n→\n5\n把成果帶回生活\n讓省下的時間回到教學、研究、關係與志向\n每一步都留下可檢查的成果","description":"請大家把今天想做的事情想成一次出航：先帶上自己的真問題與專業脈絡，再讓 Agent 補上技術翅膀。不是先學會所有工具才開始，而是從一個真實需求開始，讓工具協助我們完成以前以為不可能的事；最後仍由人驗證，並把成果帶回教學、研究與生活。\n\n這也是今天上午的學習弧線：先說清楚，再有根據、有角色、有作品、能分享。等一下請大家帶著這個問題進入實作：如果我真的多了一雙翅膀，想飛去哪裡？","image":"slides/morning-08.png","links":[],"hotspots":[],"sticker":null},{"index":9,"title":"今天的學習弧線","eyebrow":"FROM ASSISTANT TO AGENT","section":"建立 AI 教學與研究工作室","notes":"用一張圖建立全日心智模型。上午先完成 AI 教學與研究工作室，下午再把同一作品或資料分析任務交給 Agent 擴充、驗證與交付。\n\nTypeless 放在最前面，先把教師腦中的口語想法整理成可複製、可查證、可交給 Gemini Notebook 的文字素材。\n\n[Sources]\n- https://www.typeless.com/\n- https://notebook.google.com/\n[/Sources]","text":"FROM ASSISTANT TO AGENT\n今天的學習弧線\n上午場｜打造專屬 AI 教學與研究工作室\n09\n1\n先說清楚\n用 Typeless 把口語想法整理成可用文字\n→\n2\n有根據\n用 Gemini Notebook 整理可信來源\n→\n3\n有角色\n用 Gem 固定教學方法與回覆格式\n→\n4\n有作品\n用 Canvas 做出互動教學原型\n→\n5\n能分享\n用 Sites 或 Pages 發布成果\n每一步都留下可檢查的成果\nTypeless ↗  ·  Gemini Notebook ↗\nTypeless\nNotebook","description":"用一張圖建立全日心智模型。上午先完成 AI 教學與研究工作室，下午再把同一作品或資料分析任務交給 Agent 擴充、驗證與交付。\n\nTypeless 放在最前面，先把教師腦中的口語想法整理成可複製、可查證、可交給 Gemini Notebook 的文字素材。\n\n[Sources]\n- https://www.typeless.com/\n- https://notebook.google.com/\n[/Sources]","image":"slides/morning-09.png","links":[{"label":"Typeless 官方網站","url":"https://www.typeless.com/"},{"label":"Gemini Notebook","url":"https://notebook.google.com/"}],"hotspots":[{"kind":"qr","url":"https://www.typeless.com/","label":"Typeless 官方網站","x":81.4063,"y":4.5833,"w":6.5625,"h":11.6667},{"kind":"qr","url":"https://notebook.google.com/","label":"Gemini Notebook","x":88.5938,"y":4.5833,"w":6.5625,"h":11.6667},{"kind":"platform","url":"https://www.typeless.com/","label":"Typeless 官方網站","x":62.0313,"y":3.75,"w":7.8906,"h":5},{"kind":"platform","url":"https://notebook.google.com/","label":"Gemini Notebook","x":70.5469,"y":3.75,"w":8.9844,"h":5}],"sticker":null},{"index":10,"title":"上午 180 分鐘：每一段都有作品","eyebrow":"RUN OF SHOW","section":"建立 AI 教學與研究工作室","notes":"簡要說明時間節奏。實作時採 6 位教授三組雙人共作；若某帳號沒有 Gemini 權限，擔任測試者與教學觀察員仍可完整參與。Typeless 先協助把每組的口述痛點整理成後續 Notebook、Gem 與 Canvas 都能使用的任務文字。","text":"RUN OF SHOW\n上午 180 分鐘：每一段都有作品\n上午場｜打造專屬 AI 教學與研究工作室\n10\n00–10\n定題\n選一門課／一個問題\n10–25\nTypeless\n語音輸入與整理\n25–65\nNotebook\n來源與引用\n65–90\nGem\n專屬助理\n90–100\n休息\n帳號與檔案整理\n100–140\nCanvas\n互動原型\n140–180\n部署分享\n公開與回饋","description":"簡要說明時間節奏。實作時採 6 位教授三組雙人共作；若某帳號沒有 Gemini 權限，擔任測試者與教學觀察員仍可完整參與。Typeless 先協助把每組的口述痛點整理成後續 Notebook、Gem 與 Canvas 都能使用的任務文字。","image":"slides/morning-10.png","links":[],"hotspots":[],"sticker":null},{"index":11,"title":"今天離開教室前，你會有四項成果","eyebrow":"LEARNING OUTCOMES","section":"建立 AI 教學與研究工作室","notes":"請參與者把這四項成果當作今日 checklist。每一段結束會回來勾選一次。","text":"LEARNING OUTCOMES\n今天離開教室前，你會有四項成果\n上午場｜打造專屬 AI 教學與研究工作室\n11\n01\nGemini Notebook\n至少 3 份教學或研究來源、3 個有引用的問題、1 個可用輸出。\n02\n專屬 Gem\n明確角色、任務、背景與格式，並完成反例測試。\n03\nCanvas 原型\n一個可操作的課程活動、評量或學習支架。\n04\n分享方式\n完成分享連結、Google Sites 嵌入，或 GitHub Pages 部署計畫。","description":"請參與者把這四項成果當作今日 checklist。每一段結束會回來勾選一次。","image":"slides/morning-11.png","links":[],"hotspots":[],"sticker":null},{"index":12,"title":"共作規則：沒有相同帳號，也能一起完成","eyebrow":"ACCESS & PAIRING","section":"建立 AI 教學與研究工作室","notes":"六位教授建議分三組。不要讓帳號差異變成旁觀：測試者的工作是檢查引用、指令邊界、手機畫面與實際教學價值。","text":"ACCESS & PAIRING\n共作規則：沒有相同帳號，也能一起完成\n上午場｜打造專屬 AI 教學與研究工作室\n12\n主操作手\n登入有權限的工具\n負責建立、儲存與分享\n口述每一步決策\n測試與教學觀察員\n扮演學生或同儕\n提出反例與追問\n記錄可教、可用、需改善之處\n主操作\n登入與建立\n共同工作區\n成果與檢核\n觀察員\n測試與提問\n一人操作、一人驗證；成果放在同一個工作區","description":"六位教授建議分三組。不要讓帳號差異變成旁觀：測試者的工作是檢查引用、指令邊界、手機畫面與實際教學價值。","image":"slides/morning-12.png","links":[],"hotspots":[],"sticker":null},{"index":13,"title":"先從真實教學／研究痛點出發","eyebrow":"START WITH A PAIN POINT","section":"建立 AI 教學與研究工作室","notes":"痛點可能來自教學現場、研究資料、行政流程或共備工作。請每組先說出一個痛點，再把它寫成一句：『我希望哪一群學生、研究參與者或行政夥伴，在什麼情境下，完成什麼改變？』後續所有工具都服務這一句。","text":"START WITH A PAIN POINT\n先從真實教學／研究痛點出發\n上午場｜打造專屬 AI 教學與研究工作室\n13\nA\n內容理解痛點\n學生抓不到核心概念，研究者也難快速梳理多份來源。\nB\n資料分析痛點\n大量選擇題與簡答題需要整理、編碼、比對與人工複核。\nC\n互動設計痛點\n希望把講述內容轉成可操作、可探索的互動任務。\nD\n研究／行政痛點\n想把文獻、資料、方法與行政流程整理成可持續更新的工作區。","description":"痛點可能來自教學現場、研究資料、行政流程或共備工作。請每組先說出一個痛點，再把它寫成一句：『我希望哪一群學生、研究參與者或行政夥伴，在什麼情境下，完成什麼改變？』後續所有工具都服務這一句。","image":"slides/morning-13.png","links":[],"hotspots":[],"sticker":null},{"index":14,"title":"123 個案例，不是作品櫃：是教學與研究需求資料庫","eyebrow":"REAL EXAMPLES","section":"建立 AI 教學與研究工作室","notes":"現場不要逐一介紹 123 個工具。請依參與者選定的教學／研究痛點，搜尋 1–2 個最接近的案例，分析它的使用者、輸入、輸出與互動方式，完成『痛點 → 案例 → 可驗證成果』的連線。\n\n[Sources]\n- https://cagoooo.github.io/Akai/\n[/Sources]","text":"REAL EXAMPLES\n123 個案例，不是作品櫃：是教學與研究需求資料庫\n上午場｜打造專屬 AI 教學與研究工作室\n14\n阿凱老師的教育科技創新專區\n• 123 個老師做的免費工具卡片\n\n• 從課堂互動、評語優化到行政自動化\n\n• 每張卡片與部落格都可作為提示詞、介面與部署案例\n\n• 網址：cagoooo.github.io/Akai/\n開啟教育科技創新專區 ↗\n教育科技創新專區","description":"現場不要逐一介紹 123 個工具。請依參與者選定的教學／研究痛點，搜尋 1–2 個最接近的案例，分析它的使用者、輸入、輸出與互動方式，完成『痛點 → 案例 → 可驗證成果』的連線。\n\n[Sources]\n- https://cagoooo.github.io/Akai/\n[/Sources]","image":"slides/morning-14.png","links":[{"label":"教育科技創新專區","url":"https://cagoooo.github.io/Akai/"}],"hotspots":[{"kind":"qr","url":"https://cagoooo.github.io/Akai/","label":"教育科技創新專區","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://cagoooo.github.io/Akai/","label":"教育科技創新專區","x":79.0625,"y":3.75,"w":5.1563,"h":5}],"sticker":null},{"index":15,"title":"阿凱老師實戰案例導航｜語文、設計、互動","eyebrow":"AKAI CASE NAVIGATION","section":"建立 AI 教學與研究工作室","notes":"三個案例分別對應語文創作、教學設計與互動網站。現場可由三組各選一張，先讀卡片介紹，再用測試者視角操作成品。本次資料依據 H:\\Akai v3.6.109 稽核。\n\n[Sources]\n- https://cagoooo.github.io/Akai/tool/91/\n- https://cagoooo.github.io google.com/"},{"label":"會議紀錄系統","url":"https://cagoooo.github.io/domain-meeting-go/"},{"label":"Google Sites","url":"https://sites.google.com/mail2.smes.tyc.edu.tw/114teacher/"}],"hotspots":[{"kind":"qr","url":"https://notebook.google.com/","label":"Gemini Notebook","x":77.9688,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"qr","url":"https://cagoooo.github.io/domain-meeting-go/","label":"會議紀錄系統","x":83.9063,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"qr","url":"https://sites.google.com/mail2.smes.tyc.edu.tw/114teacher/","label":"Google Sites","x":89.8438,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"platform","url":"https://notebook.google.com/","label":"Gemini Notebook","x":59.4531,"y":3.75,"w":6.7969,"h":5},{"kind":"platform","url":"https://cagoooo.github.io/domain-meeting-go/","label":"會議紀錄系統","x":66.875,"y":3.75,"w":3.0469,"h":5},{"kind":"platform","url":"https://sites.google.com/mail2.smes.tyc.edu.tw/114teacher/","label":"Google Sites","x":70.5469,"y":3.75,"w":5.5469,"h":5}],"sticker":null},{"index":46,"title":"效率提高之後，省下的時間要還給人生","eyebrow":"FROM TOOL TO LIFE","section":"Canvas、網站部署與生活反思","notes":"這張是上午與下午之間的生活哲學橋接。\n\n講者觀察：Agent 讓我能完成很多以前想不到自己能做到的事，能力變得非常強大，就像擁有超能力一樣。現在 Agent 時代到來，讓人感覺「沒有你做不到的事，只有你想不到的事」。\n\n但省下時間不等於要把行程塞滿。以前自己做完一件事就結束；現在有 AI 與 Agent 幫忙，常常只要原本 1/10 甚至 1/20 的時間，效率提升至少 20 倍，就會立刻想再做更多優化與改良。這張先請大家停一下，問自己：省下來的時間，我要拿來做什麼？\n\n請把答案帶到下午最後的反思：培養興趣與未來志向、陪伴孩子與家人、和同儕與同事深入溝通，讓科技能力最後回到人的生活與關係。","text":"FROM TOOL TO LIFE\n效率提高之後，省下的時間要還給人生\n上午場｜打造專屬 AI 教學與研究工作室\n46\n01\n不是更多任務\nAgent 讓一件事更快完成；空出的時間，不必自動再塞滿。\n02\n真正重要的事\n培養興趣、探索志向，陪伴孩子與家人，和同儕深入交流。\n03\n保留人的主導權\n我們駕馭 Agent，不讓它把效率轉成無止境的工作清單。\n04\n素養教育的所在\n把工具能力內化成生活選擇，讓科技服務關係、成長與意義。","description":"這張是上午與下午之間的生活哲學橋接。\n\n講者觀察：Agent 讓我能完成很多以前想不到自己能做到的事，能力變得非常強大，就像擁有超能力一樣。現在 Agent 時代到來，讓人感覺「沒有你做不到的事，只有你想不到的事」。\n\n但省下時間不等於要把行程塞滿。以前自己做完一件事就結束；現在有 AI 與 Agent 幫忙，常常只要原本 1/10 甚至 1/20 的時間，效率提升至少 20 倍，就會立刻想再做更多優化與改良。這張先請大家停一下，問自己：省下來的時間，我要拿來做什麼？\n\n請把答案帶到下午最後的反思：培養興趣與未來志向、陪伴孩子與家人、和同儕與同事深入溝通，讓科技能力最後回到人的生活與關係。","image":"slides/morni
