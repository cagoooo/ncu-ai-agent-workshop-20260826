  <script type="application/json" id="deck-data">{"deck":"morning","title":"上午場｜打造專屬 AI 教學與研究工作室","subtitle":"Gemini Notebook、Gem、Canvas 與網站部署實作","session":"上午場","slides":[{"index":1,"title":"打造專屬 AI 教學與研究工作室：\nGemini Notebook、Gem、Canvas\n與網站部署實作","eyebrow":"上午場","section":"建立 AI 教學與研究工作室","notes":"開場先說明：今天的重點不是把所有按鈕看過一遍，而是每位參與者都完成可帶回課堂的成果。邀請大家先選定一門課程或一個教學問題。\n\n提醒：本簡報已全面採用現行名稱「Gemini Notebook」。","text":"國立中央大學｜2026.08.26\n上午場｜09:00–12:00\n打造專屬 AI 教學與研究工作室：\nGemini Notebook、Gem、Canvas\n與網站部署實作\n從 AI 教學與研究助理到 AI Agent：大學教師的生成式 AI 實作工作坊\n黃凱揚（阿凱老師）｜桃園市龍潭區石門國小資訊組長｜教學年資第 11 年","description":"開場先說明：今天的重點不是把所有按鈕看過一遍，而是每位參與者都完成可帶回課堂的成果。邀請大家先選定一門課程或一個教學問題。\n\n提醒：本簡報已全面採用現行名稱「Gemini Notebook」。","image":"slides/morning-01.png","links":[],"hotspots":[]},{"index":2,"title":"今天的學習弧線","eyebrow":"FROM ASSISTANT TO AGENT","section":"建立 AI 教學與研究工作室","notes":"用一張圖建立全日心智模型。上午先完成 AI 教學與研究工作室，下午再把同一作品或資料分析任務交給 Agent 擴充、驗證與交付。","text":"FROM ASSISTANT TO AGENT\n今天的學習弧線\n上午場｜打造專屬 AI 教學與研究工作室\n02\n1\n有根據\n用 Gemini Notebook 整理可信來源\n→\n2\n有角色\n用 Gem 固定教學方法與回覆格式\n→\n3\n有作品\n用 Canvas 做出互動教學原型\n→\n4\n能分享\n用 Sites 或 Pages 發布成果\n每一步都留下可檢查的成果","description":"用一張圖建立全日心智模型。上午先完成 AI 教學與研究工作室，下午再把同一作品或資料分析任務交給 Agent 擴充、驗證與交付。","image":"slides/morning-02.png","links":[],"hotspots":[]},{"index":3,"title":"上午 180 分鐘：每一段都有作品","eyebrow":"RUN OF SHOW","section":"建立 AI 教學與研究工作室","notes":"簡要說明時間節奏。實作時採 6 位教授三組雙人共作；若某帳號沒有 Gemini 權限，擔任測試者與教學觀察員仍可完整參與。","text":"RUN OF SHOW\n上午 180 分鐘：每一段都有作品\n上午場｜打造專屬 AI 教學與研究工作室\n03\n00–15\n定題\n選一門課／一個問題\n15–55\nNotebook\n來源與引用\n55–80\nGem\n專屬助理\n80–90\n休息\n帳號與檔案整理\n90–135\nCanvas\n互動原型\n135–180\n部署分享\n公開與回饋","description":"簡要說明時間節奏。實作時採 6 位教授三組雙人共作；若某帳號沒有 Gemini 權限，擔任測試者與教學觀察員仍可完整參與。","image":"slides/morning-03.png","links":[],"hotspots":[]},{"index":4,"title":"今天離開教室前，你會有四項成果","eyebrow":"LEARNING OUTCOMES","section":"建立 AI 教學與研究工作室","notes":"請參與者把這四項成果當作今日 checklist。每一段結束會回來勾選一次。","text":"LEARNING OUTCOMES\n今天離開教室前，你會有四項成果\n上午場｜打造專屬 AI 教學與研究工作室\n04\n01\nGemini Notebook\n至少 3 份教學或研究來源、3 個有引用的問題、1 個可用輸出。\n02\n專屬 Gem\n明確角色、任務、背景與格式，並完成反例測試。\n03\nCanvas 原型\n一個可操作的課程活動、評量或學習支架。\n04\n分享方式\n完成分享連結、Google Sites 嵌入，或 GitHub Pages 部署計畫。","description":"請參與者把這四項成果當作今日 checklist。每一段結束會回來勾選一次。","image":"slides/morning-04.png","links":[],"hotspots":[]},{"index":5,"title":"共作規則：沒有相同帳號，也能一起完成","eyebrow":"ACCESS & PAIRING","section":"建立 AI 教學與研究工作室","notes":"六位教授建議分三組。不要讓帳號差異變成旁觀：測試者的工作是檢查引用、指令邊界、手機畫面與實際教學價值。","text":"ACCESS & PAIRING\n共作規則：沒有相同帳號，也能一起完成\n上午場｜打造專屬 AI 教學與研究工作室\n05\n主操作手\n登入有權限的工具\n負責建立、儲存與分享\n口述每一步決策\n測試與教學觀察員\n扮演學生或同儕\n提出反例與追問\n記錄可教、可用、需改善之處\n主操作\n登入與建立\n共同工作區\n成果與檢核\n觀察員\n測試與提問\n一人操作、一人驗證；成果放在同一個工作區","description":"六位教授建議分三組。不要讓帳號差異變成旁觀：測試者的工作是檢查引用、指令邊界、手機畫面與實際教學價值。","image":"slides/morning-05.png","links":[],"hotspots":[]},{"index":6,"title":"先選一個真實教學或研究問題","eyebrow":"START WITH A PROBLEM","section":"建立 AI 教學與研究工作室","notes":"請每組選一題，寫成一句：『我希望哪一群學生，在什麼情境下，完成什麼改變？』後續所有工具都服務這一句。","text":"START WITH A PROBLEM\n先選一個真實教學或研究問題\n上午場｜打造專屬 AI 教學與研究工作室\n06\nA\n內容太多\n學生抓不到核心概念，研究者也難快速梳理多份來源。\nB\n資料難分析\n大量選擇題與簡答題需要整理、編碼、比對與人工複核。\nC\n活動太平\n希望把講述內容轉成可操作、可探索的互動任務。\nD\n研究難累積\n想把文獻、資料、方法與成果整理成可持續更新的工作區。","description":"請每組選一題，寫成一句：『我希望哪一群學生，在什麼情境下，完成什麼改變？』後續所有工具都服務這一句。","image":"slides/morning-06.png","links":[],"hotspots":[]},{"index":7,"title":"123 個案例，不是作品櫃：是教學與研究需求資料庫","eyebrow":"REAL EXAMPLES","section":"建立 AI 教學與研究工作室","notes":"現場不要逐一介紹 123 個工具。請依參與者選定的教學問題，搜尋 1–2 個最接近的案例，分析它的使用者、輸入、輸出與互動方式。\n\n[Sources]\n- https://cagoooo.github.io/Akai/\n[/Sources]","text":"REAL EXAMPLES\n123 個案例，不是作品櫃：是教學與研究需求資料庫\n上午場｜打造專屬 AI 教學與研究工作室\n07\n阿凱老師的教育科技創新專區\n• 123 個老師做的免費工具卡片\n\n• 從課堂互動、評語優化到行政自動化\n\n• 每張卡片與部落格都可作為提示詞、介面與部署案例\n\n• 網址：cagoooo.github.io/Akai/\n開啟教育科技創新專區 ↗\n教育科技創新專區","description":"現場不要逐一介紹 123 個工具。請依參與者選定的教學問題，搜尋 1–2 個最接近的案例，分析它的使用者、輸入、輸出與互動方式。\n\n[Sources]\n- https://cagoooo.github.io/Akai/\n[/Sources]","image":"slides/morning-07.png","links":[{"label":"教育科技創新專區","url":"https://cagoooo.github.io/Akai/"}],"hotspots":[{"kind":"qr","url":"https://cagooo 4375,"y":3.75,"w":10.7813,"h":5}]},{"index":12,"title":"Gemini Notebook：先管理證據，再生成內容","eyebrow":"SOURCE-GROUNDED WORKSPACE","section":"Gemini Notebook","notes":"示範同一個問題在一般聊天與來源型筆記本的差異。重點不是『一定正確』，而是『更容易追查與修正』。\n\n[Sources]\n- https://support.google.com/gemininotebook/answer/16164461?hl=zh-Hant\n[/Sources]","text":"SOURCE-GROUNDED WORKSPACE\nGemini Notebook：先管理證據，再生成內容\n上午場｜打造專屬 AI 教學與研究工作室\n12\n一般聊天\n問題先出現\n來源可能來自模型既有知識\n需要自行追查依據\nGemini Notebook\n來源先進入筆記本\n依使用者提供的來源回答\n可回到引用位置檢查\n提問\n引用\n原文\n可追查鏈：回答 → 引用位置 → 原始段落\n開啟 Gemini Notebook ↗\nNotebook","description":"示範同一個問題在一般聊天與來源型筆記本的差異。重點不是『一定正確』，而是『更容易追查與修正』。\n\n[Sources]\n- https://support.google.com/gemininotebook/answer/16164461?hl=zh-Hant\n[/Sources]","image":"slides/morning-12.png","links":[{"label":"Gemini Notebook 說明","url":"https://support.google.com/gemininotebook/answer/16164461?hl=zh-Hant"}],"hotspots":[{"kind":"qr","url":"https://support.google.com/gemininotebook/answer/16164461?hl=zh-Hant","label":"Gemini Notebook 說明","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://support.google.com/gemininotebook/answer/16164461?hl=zh-Hant","label":"Gemini Notebook 說明","x":73.4375,"y":3.75,"w":10.7813,"h":5}]},{"index":13,"title":"來源包 3–2–1：小而精，先求可用","eyebrow":"SOURCE KIT","section":"Gemini Notebook","notes":"要求每組先用少量高品質來源建立第一版。來源太多會讓提問與檢核難度提高，熟悉後再擴增。","text":"SOURCE KIT\n來源包 3–2–1：小而精，先求可用\n上午場｜打造專屬 AI 教學與研究工作室\n13\n3\n3 份核心來源\n課程大綱／授課講義／一篇可信研究或政策文件。\n2\n2 種觀點\n至少納入互補或相反觀點，避免只有單一聲音。\n1\n1 個教學目的\n明確指定要產出導讀、活動、評量或回饋。\n開啟 Gemini Notebook ↗\nNotebook","description":"要求每組先用少量高品質來源建立第一版。來源太多會讓提問與檢核難度提高，熟悉後再擴增。","image":"slides/morning-13.png","links":[{"label":"開啟 Gemini Notebook","url":"https://notebook.google.com/"}],"hotspots":[{"kind":"qr","url":"https://notebook.google.com/","label":"開啟 Gemini Notebook","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://notebook.google.com/","label":"開啟 Gemini Notebook","x":73.4375,"y":3.75,"w":10.7813,"h":5}]},{"index":14,"title":"示範：四步建立第一個筆記本","eyebrow":"LIVE DEMO","section":"Gemini Notebook","notes":"示範時刻意問一個來源中沒有答案的問題，讓大家看見系統的邊界。再改寫問題，使它更具體。\n\n[Sources]\n- https://support.google.com/gemininotebook/answer/16206563?hl=zh-Hant\n[/Sources]","text":"LIVE DEMO\n示範：四步建立第一個筆記本\n上午場｜打造專屬 AI 教學與研究工作室\n14\n1\n建立\n以課程＋任務命名\n→\n2\n加入\n上傳檔案或貼入網址\n→\n3\n提問\n限定對象、目的與格式\n→\n4\n查證\n點引用回到原始段落\n每一步都留下可檢查的成果\n開啟 Gemini Notebook ↗\nNotebook","description":"示範時刻意問一個來源中沒有答案的問題，讓大家看見系統的邊界。再改寫問題，使它更具體。\n\n[Sources]\n- https://support.google.com/gemininotebook/answer/16206563?hl=zh-Hant\n[/Sources]","image":"slides/morning-14.png","links":[{"label":"Gemini Notebook 說明","url":"https://support.google.com/gemininotebook/answer/16206563?hl=zh-Hant"}],"hotspots":[{"kind":"qr","url":"https://support.google.com/gemininotebook/answer/16206563?hl=zh-Hant","label":"Gemini Notebook 說明","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://support.google.com/gemininotebook/answer/16206563?hl=zh-Hant","label":"Gemini Notebook 說明","x":73.4375,"y":3.75,"w":10.7813,"h":5}]},{"index":15,"title":"實作一｜建立課程 Gemini Notebook","eyebrow":"HANDS-ON","section":"Gemini Notebook","notes":"逐組巡視，優先協助來源格式與權限。提醒參與者不要上傳含學生個資、未授權教材或敏感研究資料。","text":"HANDS-ON\n實作一｜建立課程 Gemini Notebook\n上午場｜打造專屬 AI 教學與研究工作室\n15\n15\n分鐘\n操作步驟\n1\n建立以課程與任務命名的筆記本\n2\n加入至少 3 份來源\n3\n提出 1 個理解題與 1 個比較題\n4\n點開引用，核對原文\n完成條件\n✓ 筆記本名稱可辨識\n\n✓ 來源至少 3 份\n\n✓ 至少 1 個引用正確\n\n✓ 記下一個需修正的問題\n開啟 Gemini Notebook ↗\nNotebook","description":"逐組巡視，優先協助來源格式與權限。提醒參與者不要上傳含學生個資、未授權教材或敏感研究資料。","image":"slides/morning-15.png","links":[{"label":"開啟 Gemini Notebook","url":"https://notebook.google.com/"}],"hotspots":[{"kind":"qr","url":"https://notebook.google.com/","label":"開啟 Gemini Notebook","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://notebook.google.com/","label":"開啟 Gemini Notebook","x":73.4375,"y":3.75,"w":10.7813,"h":5}]},{"index":16,"title":"三層提問法：從讀懂到能教","eyebrow":"PROMPT LADDER","section":"Gemini Notebook","notes":"現場請每組依序跑三層提問，感受『問題層級』如何改變輸出。若回答無法回到來源，先修問題，不急著追求華麗文字。","text":"PROMPT LADDER\n三層提問法：從讀懂到能教\n上午場｜打造專屬 AI 教學與研究工作室\n16\n1\n理解\n只依來源，用 150 字解釋核心概念；列出 3 個關鍵詞與引用。\n2\n比較\n比較來源 A、B 的主張、證據與限制；用表格呈現。\n3\n轉化\n依來源設計 20 分鐘活動；包含目標、步驟、提問與檢核。\n開啟 Gemini Notebook ↗\nNotebook","description":"現場請每組依序跑三層提問，感受『問題層級』如何改變輸出。若回答無法回到來源，先修問題，不急著追求華麗文字。","image":"slides/morning-16.png","links":[{"label":"開啟 Gemini Notebook","url":"https://notebook.google.com/"}],"hotspots":[{"kind":"qr","url":"https://notebook.google.com/","label":"開啟 Gemini Notebook","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://notebook.google.com/","label":"開啟 Gemini Notebook","x":73.4375,"y":3.75,"w":10.7813,"h":5}]},{"index":17,"title":"把來源轉成可直接使用的教學成品","eyebrow":"TEACHING OUTPUTS","section":"Gemini Notebook","notes":"請參與者只選一個成品完成，不要同時生成全部。完成後用『內容依據、學生可用、教師可改』三項快速評估。\n\n[Sources]\n- https://support.google.com/gemininotebook/answer/16164461?hl=zh-Hant\n[/Sources]","text":"TEACHING OUTPUTS\n把來源轉成可直接使用的教學成品\n上午場｜打造專屬 AI 教學與研究工作室\n17\n01\n課前\n導讀問題、概念地圖、術語表、預習任務。\n02\n課中\n案例比較、討論角色卡、分組任務、即時測驗。\n03\n課後\n學習指南、形成性回饋、反思題、延伸閱讀。\n04\n研究／共備\n文獻觀點矩陣、研究缺口、共同備課摘要。\n開啟 Gemini Notebook ↗\nNotebook","description":"請參與者只選一個成品完成，不要同時生成全部。完成後用『內容依據、學生可用、教師可改』三項快速評估。\n\n[Sources]\n- https://support.google.com/gemininotebook/answer/16164461?hl=zh-Hant\n[/Sources]","image":"slides/morning-17.png","links":[{"label":"開啟 Gemini Notebook","url":"https://notebook.google.com/"}],"hotspots":[{"kind":"qr","url":"https://notebook.google.com/","label":"開啟 Gemini Notebook","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://notebook.google.com/","label":"開啟 Gemini Notebook","x":73.4375,"y":3.75,"w":10.7813,"h":5}]},{"index":18,"title":"Checkpoint｜Notebook 合格了嗎？","eyebrow":"QUALITY GATE","section":"Gemini Notebook","notes":"讓每組口頭報告一個『回答得好』與一個『來源不足』的例子。這一步建立查證習慣。","text":"QUALITY GATE\nCheckpoint｜Notebook 合格了嗎？\n上午場｜打造專屬 AI 教學與研究工作室\n18\n01\n來源\n資料可信、可授權使用，且與教學目的直接相關。\n02\n引用\n至少抽查一個引用，原文確實支持回答。\n03\n邊界\n知道
