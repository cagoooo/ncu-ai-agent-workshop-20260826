  <script type="application/json" id="deck-data">{"deck":"afternoon","title":"下午場｜打造會做事的 AI 教學與研究夥伴","subtitle":"Antigravity、Codex、Claude、Agent Skills 與資料分析實戰","session":"下午場","slides":[{"index":1,"title":"打造會做事的 AI\n教學與研究夥伴：\nAntigravity／Codex\nClaude／Agent Skills\n資料分析實戰","eyebrow":"下午場","section":"從助理走向 Agent","notes":"開場說明：下午場聚焦於『會做事的 AI Agent』。重點不是死記指令，而是理解 Agent 的調控架構——【Harness 與 Harness Engineering（裝具工程）】。每位參與者都將理解 Agent 如何在環境中調度工具、自我修正並交付可驗證成果。","text":"國立中央大學｜2026.08.26\n下午場｜13:00–16:00\n打造會做事的 AI\n教學與研究夥伴：\nAntigravity／Codex\nClaude／Agent Skills\n資料分析實戰\n從 AI 教學與研究助理到 AI Agent：大學教師的生成式 AI 實作工作坊\n黃凱揚（阿凱老師）｜桃園市龍潭區石門國小資訊組長｜教學年資第 11 年","description":"開場說明：下午場聚焦於『會做事的 AI Agent』。重點不是死記指令，而是理解 Agent 的調控架構——【Harness 與 Harness Engineering（裝具工程）】。每位參與者都將理解 Agent 如何在環境中調度工具、自我修正並交付可驗證成果。","image":"slides/afternoon-01.png","links":[],"hotspots":[]},{"index":2,"title":"下午離開前，你會有四項成果","eyebrow":"LEARNING OUTCOMES","section":"從助理走向 Agent","notes":"說明下午不是程式設計課，而是任務設計、權限判斷與成果驗證課。沒有 Google 訂閱的參與者可在 Codex 完成主要任務，Antigravity 採同組共作。","text":"LEARNING OUTCOMES\n下午離開前，你會有四項成果\n下午場｜打造會做事的 AI 教學與研究夥伴\n02\n01\n看懂 Agent\n能分辨對話、助理與 Agent，知道何時必須人在迴路。\n02\n建立工具策略\n比較 Antigravity、Codex 與 Claude，依任務、額度與驗收證據選擇工具。\n03\n完成一個 Skill\n把教學或研究提示詞升級成可重複、可測試的工作流程。\n04\n完成資料分析\n以合成資料練習選擇題統計、簡答初編與人工複核。","description":"說明下午不是程式設計課，而是任務設計、權限判斷與成果驗證課。沒有 Google 訂閱的參與者可在 Codex 完成主要任務，Antigravity 採同組共作。","image":"slides/afternoon-02.png","links":[],"hotspots":[]},{"index":3,"title":"下午 180 分鐘：從操作到可重複流程","eyebrow":"RUN OF SHOW","section":"從助理走向 Agent","notes":"提醒每一段都沿用上午作品與同一個教學／研究痛點與問題。參與者不需要重新發想題目。","text":"RUN OF SHOW\n下午 180 分鐘：從操作到可重複流程\n下午場｜打造會做事的 AI 教學與研究夥伴\n03\n00–20\nAgent 觀念\n能力與風險\n20–45\nAntigravity\n任務與證據\n45–70\nClaude\n模型與成本\n70–95\nCodex\n實作工作流\n95–105\n休息\n整理成果\n105–140\nAgent Skills\n提示詞升級\n140–160\n學生資料\nPIRLS 風格分析\n160–180\n整合分享\n可驗證交付","description":"提醒每一段都沿用上午作品與同一個教學／研究痛點與問題。參與者不需要重新發想題目。","image":"slides/afternoon-03.png","links":[],"hotspots":[]},{"index":4,"title":"對話、助理、Agent：差別在能否推進工作","eyebrow":"CAPABILITY LADDER","section":"從助理走向 Agent","notes":"深度解析能力的階梯：\n- 【對話】：問答發想，無工作記憶與行動能力。\n- 【助理】：固定角色與格式，但缺乏主動感知。\n- 【AI Agent 與 Harness】：為什麼大語言模型（LLM）本身不是 Agent？LLM 是強大的運算大腦/引擎，但它沒有手腳、無法持久感知環境。\n- 【什麼是 Harness？】：Harness 是套在模型外部的『調控裝具 / 控管鞍具』——負責為模型掛載檔案系統、命令列、瀏覽器、上下文記憶與安全防護欄，如同為火箭引擎配備控制艙與導航系統，讓模型真正能在約束邊界內主動做事！","text":"CAPABILITY LADDER\n對話、助理、Agent：差別在能否推進工作\n下午場｜打造會做事的 AI 教學與研究夥伴\n04\n1\n對話\n回答、解釋、發想\n→\n2\n助理\n固定角色與格式\n→\n3\nAgent\n讀取環境、規劃、使用工具\n→\n4\n可信 Agent\n驗證結果、回報限制、等待授權\n每一步都留下可檢查的成果","description":"深度解析能力的階梯：\n- 【對話】：問答發想，無工作記憶與行動能力。\n- 【助理】：固定角色與格式，但缺乏主動感知。\n- 【AI Agent 與 Harness】：為什麼大語言模型（LLM）本身不是 Agent？LLM 是強大的運算大腦/引擎，但它沒有手腳、無法持久感知環境。\n- 【什麼是 Harness？】：Harness 是套在模型外部的『調控裝具 / 控管鞍具』——負責為模型掛載檔案系統、命令列、瀏覽器、上下文記憶與安全防護欄，如同為火箭引擎配備控制艙與導航系統，讓模型真正能在約束邊界內主動做事！","image":"slides/afternoon-04.png","links":[],"hotspots":[]},{"index":5,"title":"Agent 五步循環：完成，不是只產生","eyebrow":"AGENT LOOP","section":"從助理走向 Agent","notes":"解析 Agent 五步循環與【Harness Engineering（裝具工程）四大調控支柱】：\n1. 【Context & State Management（狀態與記憶調控）】：Harness 負責過濾歷史雜訊、管理工作記憶，防止 Token 爆炸與目標迷失。\n2. 【Tool & MCP Dispatching（工具調度）】：Harness 提供安全的 API、終端指令與檔案讀寫協議，將模型的意圖轉化為真實世界的操作。\n3. 【Self-Correction & Eval Loop（自省評估閉環）】：當執行出錯時，Harness 捕獲錯誤反饋給模型，驅動模型自動反思、重試與修正，直到通過驗收標準。\n4. 【Sandboxing & Guardrails（沙盒與安全防護欄）】：隔離敏感權限、實施可逆操作確認，確保 Agent 永遠在教授授權的安全邊界內運行。\n\n結論：真正的完成不是『AI 說它做完了』，而是『Harness 驗證通過並產出完整證據』。","text":"AGENT LOOP\nAgent 五步循環：完成，不是只產生\n下午場｜打造會做事的 AI 教學與研究夥伴\n05\n1\n理解\n確認目標與環境\n→\n2\n規劃\n拆解步驟與風險\n→\n3\n執行\n讀檔、寫檔、使用工具\n→\n4\n驗證\n測試、畫面、差異\n→\n5\n交付\n成果、限制、下一步\n每一步都留下可檢查的成果","description":"解析 Agent 五步循環與【Harness Engineering（裝具工程）四大調控支柱】：\n1. 【Context & State Management（狀態與記憶調控）】：Harness 負責過濾歷史雜訊、管理工作記憶，防止 Token 爆炸與目標迷失。\n2. 【Tool & MCP Dispatching（工具調度）】：Harness 提供安全的 API、終端指令與檔案讀寫協議，將模型的意圖轉化為真實世界的操作。\n3. 【Self-Correction & Eval Loop（自省評估閉環）】：當執行出錯時，Harness 捕獲錯誤反饋給模型，驅動模型自動反思、重試與修正，直到通過驗收標準。\n4. 【Sandboxing & Guardrails（沙盒與安全防護欄）】：隔離敏感權限、實施可逆操作確認，確保 Agent 永遠在教授授權的安全邊界內運行。\n\n結論：真正的完成不是『AI 說它做完了』，而是『Harness 驗證通過並產出完整證據』。","image":"slides/afternoon-05.png","links":[],"hotspots":[]},{"index":6,"title":"人在迴路：三種情況一定要停一下","eyebrow":"HUMAN CONTROL","section":"從助理走向 Agent","notes":"先讀取與分析通常風險較低；公開、刪除與替人做決策需要明確授權。請參與者把『需要我確認後才做』寫入任務限制。","text":"HUMAN CONTROL\n人在迴路：三種情況一定要停一下\n下午場｜打造會做事的 AI 教學與研究夥伴\n06\nSTOP\n不可逆\n刪除、覆寫、公開發布、寄信、上傳、改權限。\nSAFE\n敏感\n學生個資、成績、未公開研究、帳號與金鑰。\nASK\n高影響\n正式評量、行政決策、倫理或專業判斷。","description":"先讀取與分析通常風險較低；公開、刪除與替人做決策需要明確授權。請參與者把『需要我確認後才做』寫入任務限制。","image":"slides/afternoon-06.png","links":[],"hotspots":[]},{"index":7,"title":"三大 Agent 的人生交往學：看個性、選伴侶、配任務","eyebrow":"AGENT PERSONALITY & STRATEGY","section":"從助理走向 Agent","notes":"三大 Agent 交往學概論與 Harness 架構比較：\n- 【Antigravity】：Google 深度開發環境 Harness，具備多模態即時 Artifact 渲染、主動規劃與子代理（Subagent）並行調度能力。\n- 【Codex】：OpenAI 強悍的 Sandbox 沙盒 Harness，終端執行極致穩定、精準掌控檔案讀寫與資料分析流程。\n- 【Claude Code】：優雅的終端 Harness，強大的上下文壓縮（Compact）與極致嚴謹的程式碼變更審查。\n三者底層模型不同，但均依賴精密的 Harness Engineering 實現自主任務推進。","text":"AGENT PERSONALITY & STRATEGY\n三大 Agent 的人生交往學：看個性、選伴侶、配任務\n下午場｜打造會做事的 AI 教學與研究夥伴\n07\nG\nAntigravity／Gemini\n• 人設：熱血年輕弟弟，Flash 模型極速狂飆（速度快 20 倍以上）\n• 優勢：指令秒回、成果驚豔、衝勁十足，快速迭代超爽快\n• 特性：一頭熱不易持久，續航力有限（易觸碰冷卻輪數）\n• 最適合：靈感衝刺、快速原型、短平快修復、小步快跑\nC\nClaude\n• 人設：成熟穩重的終身伴侶，進入細水長流的婚姻穩定期\n• 優勢：極致沉穩可靠，代碼與長鏈任務完全不用擔心翻車\n• 特性：少突發驚喜，Token 燒完必須耐心等每週週期重置\n• 最適合：大型系統重構、複雜多檔分析、關鍵高難度任務\nX\nCodex／ChatGPT\n• 人設：變化性最大、彈性極高的情人，可切換 1.5 倍速\n• 優勢：支援原生語音流暢口述，要快要穩隨心所欲靈活切換\n• 亮點：常有重置驚喜與 100% 回檔彈性，讓你隨時接關做下去\n• 最適合：日常研究輔助、互動工具、語音實作、頻繁試錯\nAntigravity ↗  ·  Codex ↗  ·  Claude ↗\nAntigravity\nCodex\nClaude","description":"三大 Agent 交往學概論與 Harness 架構比較：\n- 【Antigravity】：Google 深度開發環境 Harness，具備多模態即時 Artifact 渲染、主動規劃與子代理（Subagent）並行調度能力。\n- 【Codex】：OpenAI 強悍的 Sandbox 沙盒 Harness，終端執行極致穩定、精準掌控檔案讀寫與資料分析流程。\n- 【Claude Code】：優雅的終端 Harness，強大的上下文壓縮（Compact）與極致嚴謹的程式碼變更審查。\n三者底層模型不同，但均依賴精密的 Harness Engineering 實現自主任務推進。","image":"slides/afternoon-07.png","links":[{"label":"Antigravity","url":"https://antigravity.google/"},{"label":"Codex","url":"https://chatgpt.com/codex/"},{"label":
