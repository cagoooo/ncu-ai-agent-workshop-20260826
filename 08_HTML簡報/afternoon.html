  <script type="application/json" id="deck-data">{"deck":"afternoon","title":"下午場｜打造會做事的 AI 教學與研究夥伴","subtitle":"Antigravity、Codex、Claude、Agent Skills 與資料分析實戰","session":"下午場","slides":[{"index":1,"title":"打造會做事的 AI\n教學與研究夥伴：\nAntigravity／Codex\nClaude／Agent Skills\n資料分析實戰","eyebrow":"下午場","section":"從助理走向 Agent","notes":"開場先說明：今天的重點不是把所有按鈕看過一遍，而是每位參與者都完成可帶回課堂的成果。邀請大家先選定一門課程，以及一個真實的教學／研究痛點與問題。\n\n提醒：本簡報已全面採用現行名稱「Gemini Notebook」。","text":"國立中央大學｜2026.08.26\n下午場｜13:00–16:00\n打造會做事的 AI\n教學與研究夥伴：\nAntigravity／Codex\nClaude／Agent Skills\n資料分析實戰\n從 AI 教學與研究助理到 AI Agent：大學教師的生成式 AI 實作工作坊\n黃凱揚（阿凱老師）｜桃園市龍潭區石門國小資訊組長｜教學年資第 11 年","description":"開場先說明：今天的重點不是把所有按鈕看過一遍，而是每位參與者都完成可帶回課堂的成果。邀請大家先選定一門課程，以及一個真實的教學／研究痛點與問題。\n\n提醒：本簡報已全面採用現行名稱「Gemini Notebook」。","image":"slides/afternoon-01.png","links":[],"hotspots":[],"sticker":null},{"index":2,"title":"下午離開前，你會有四項成果","eyebrow":"LEARNING OUTCOMES","section":"從助理走向 Agent","notes":"說明下午不是程式設計課，而是任務設計、權限判斷與成果驗證課。沒有 Google 訂閱的參與者可在 Codex 完成主要任務，Antigravity 採同組共作。","text":"LEARNING OUTCOMES\n下午離開前，你會有四項成果\n下午場｜打造會做事的 AI 教學與研究夥伴\n02\n01\n看懂 Agent\n能分辨對話、助理與 Agent，知道何時必須人在迴路。\n02\n建立工具策略\n比較 Antigravity／Gemini 3.7 Flash、Codex 與 Claude，依任務、權限與驗收證據選擇工具。\n03\n完成一個 Skill\n把教學或研究提示詞升級成可重複、可測試的工作流程。\n04\n完成資料分析\n以合成資料練習選擇題統計、簡答初編與人工複核。","description":"說明下午不是程式設計課，而是任務設計、權限判斷與成果驗證課。沒有 Google 訂閱的參與者可在 Codex 完成主要任務，Antigravity 採同組共作。","image":"slides/afternoon-02.png","links":[],"hotspots":[],"sticker":null},{"index":3,"title":"下午 180 分鐘：從操作到可重複流程","eyebrow":"RUN OF SHOW","section":"從助理走向 Agent","notes":"提醒每一段都沿用上午作品與同一個教學／研究痛點與問題。參與者不需要重新發想題目。","text":"RUN OF SHOW\n下午 180 分鐘：從操作到可重複流程\n下午場｜打造會做事的 AI 教學與研究夥伴\n03\n00–20\nAgent 觀念\n能力與風險\n20–45\nAntigravity\n任務與證據\n45–70\nClaude\n模型與成本\n70–95\nCodex\n實作工作流\n95–105\n休息\n整理成果\n105–140\nAgent Skills\n提示詞升級\n140–160\n學生資料\nPIRLS 風格分析\n160–180\n整合分享\n可驗證交付","description":"提醒每一段都沿用上午作品與同一個教學／研究痛點與問題。參與者不需要重新發想題目。","image":"slides/afternoon-03.png","links":[],"hotspots":[],"sticker":null},{"index":4,"title":"對話、助理、Agent：差別在能否推進工作","eyebrow":"CAPABILITY LADDER","section":"從助理走向 Agent","notes":"用一個例子說明：『告訴我如何改網站』是對話；『依我的規則產出設計建議』是助理；『讀取專案、修改、測試、交付』才是 Agent 任務。","text":"CAPABILITY LADDER\n對話、助理、Agent：差別在能否推進工作\n下午場｜打造會做事的 AI 教學與研究夥伴\n04\n1\n對話\n回答、解釋、發想\n→\n2\n助理\n固定角色與格式\n→\n3\nAgent\n讀取環境、規劃、使用工具\n→\n4\n可信 Agent\n驗證結果、回報限制、等待授權\n每一步都留下可檢查的成果","description":"用一個例子說明：『告訴我如何改網站』是對話；『依我的規則產出設計建議』是助理；『讀取專案、修改、測試、交付』才是 Agent 任務。","image":"slides/afternoon-04.png","links":[],"hotspots":[],"sticker":null},{"index":5,"title":"Agent 五步循環：完成，不是只產生","eyebrow":"AGENT LOOP","section":"從助理走向 Agent","notes":"要求參與者之後每次都問：Agent 的完成證據在哪裡？若只有一段漂亮說明，工作還沒有完成。","text":"AGENT LOOP\nAgent 五步循環：完成，不是只產生\n下午場｜打造會做事的 AI 教學與研究夥伴\n05\n1\n理解\n確認目標與環境\n→\n2\n規劃\n拆解步驟與風險\n→\n3\n執行\n讀檔、寫檔、使用工具\n→\n4\n驗證\n測試、畫面、差異\n→\n5\n交付\n成果、限制、下一步\n每一步都留下可檢查的成果","description":"要求參與者之後每次都問：Agent 的完成證據在哪裡？若只有一段漂亮說明，工作還沒有完成。","image":"slides/afternoon-05.png","links":[],"hotspots":[],"sticker":null},{"index":6,"title":"為什麼 Agent 會紅起來？從 OpenClaw 看見「長了手腳」","eyebrow":"WHY AGENTS NOW · OPENCLAW","section":"從助理走向 Agent","notes":"為什麼 Agent 會在 2026 年初開始紅起來？OpenClaw（小龍蝦）是一個很適合拿來說明轉折的案例：大家原本把 AI 想成聊天機器人，但 OpenClaw 讓人更直觀地看到，模型可以透過 Gateway 連接模型、工具、訊息渠道與裝置，從回答問題進一步變成執行任務。\n\nOpenClaw 官方文件與原始碼說明，它可以使用主機上的工具，也能透過 companion apps／nodes 執行裝置端行動；官方 CLI 有 agent exec，MCP 也能把外部工具納入執行面。這就是「長了手腳」的比喻：模型不只輸出文字，還能讀取環境、呼叫軟體、執行命令、操作瀏覽器或串接其他工具。\n\n這頁的「爆紅」是社群現象與教學脈絡，不宣稱 OpenClaw 單獨造成三大公司的路線轉向；比較精準的說法是，OpenClaw 讓一條產業共同注意的道路變得可見：模型強度已經足以開始調用工具、串接 MCP／CLI，並把人類交代的事情推進成閉環任務。\n\n最後提醒：本地端工具權限越大，風險也越高。使用 Agent 前要限定工作區、權限、可用工具與停止條件，這正好銜接後面的 Harness 與 Human-in-the-loop。\n\n[Sources]\n- https://openclaw.ai/\n- https://github.com/openclaw/openclaw\n- https://docs.openclaw.ai/cli/agent\n- https://github.com/openclaw/openclaw/blob/main/docs/cli/mcp.md\n[/Sources]","text":"WHY AGENTS NOW · OPENCLAW\n為什麼 Agent 會紅起來？從 OpenClaw 看見「長了手腳」\n下午場｜打造會做事的 AI 教學與研究夥伴\n06\n01\n聊天機器人的邊界\n原本以為 AI 只會回答、摘要與生成文字；Agent 開始接手的是「做事」。\n02\nOpenClaw 的觸發\n2026 年初 OpenClaw（小龍蝦）受到高度關注，讓更多人直觀看到模型可以連到裝置、工具與訊息渠道。\n03\n手腳是工具鏈\n透過 MCP、CLI、瀏覽器、檔案與主機工具，Agent 能讀取環境、呼叫軟體、執行命令並回報結果。\n04\n產業共同轉向\nOpenAI、Anthropic、Google 都把工具呼叫、電腦使用與 Agent 工作流推到前線；OpenClaw 讓這條路變得具體可感。\nOpenClaw 官方網站 ↗  ·  OpenClaw GitHub ↗\nOpenClaw 官方網\nOpenClaw Git","description":"為什麼 Agent 會在 2026 年初開始紅起來？OpenClaw（小龍蝦）是一個很適合拿來說明轉折的案例：大家原本把 AI 想成聊天機器人，但 OpenClaw 讓人更直觀地看到，模型可以透過 Gateway 連接模型、工具、訊息渠道與裝置，從回答問題進一步變成執行任務。\n\nOpenClaw 官方文件與原始碼說明，它可以使用主機上的工具，也能透過 companion apps／nodes 執行裝置端行動；官方 CLI 有 agent exec，MCP 也能把外部工具納入執行面。這就是「長了手腳」的比喻：模型不只輸出文字，還能讀取環境、呼叫軟體、執行命令、操作瀏覽器或串接其他工具。\n\n這頁的「爆紅」是社群現象與教學脈絡，不宣稱 OpenClaw 單獨造成三大公司的路線轉向；比較精準的說法是，OpenClaw 讓一條產業共同注意的道路變得可見：模型強度已經足以開始調用工具、串接 MCP／CLI，並把人類交代的事情推進成閉環任務。\n\n最後提醒：本地端工具權限越大，風險也越高。使用 Agent 前要限定工作區、權限、可用工具與停止條件，這正好銜接後面的 Harness 與 Human-in-the-loop。\n\n[Sources]\n- https://openclaw.ai/\n- https://github.com/openclaw/openclaw\n- https://docs.openclaw.ai/cli/agent\n- https://github.com/openclaw/openclaw/blob/main/docs/cli/mcp.md\n[/Sources]","image":"slides/afternoon-06.png","links":[{"label":"OpenClaw 官方網站","url":"https://openclaw.ai/"},{"label":"OpenClaw GitHub","url":"https://github.com/openclaw/openclaw"}],"hotspots":[{"kind":"qr","url":"https://openclaw.ai/","label":"OpenClaw 官方網站","x":81.4063,"y":4.5833,"w":6.5625,"h":11.6667},{"kind":"qr","url":"https://github.com/openclaw/openclaw","label":"OpenClaw GitHub","x":88.5938,"y":4.5833,"w":6.5625,"h":11.6667},{"kind":"platform","url":"https://openclaw.ai/","label":"OpenClaw 官方網站","x":62.0313,"y":3.75,"w":7.8906,"h":5},{"kind":"platform","url":"https://github.com/openclaw/openclaw","label":"OpenClaw GitHub","x":70.5469,"y":3.75,"w":8.9844,"h":5}],"sticker":null},{"index":7,"title":"Human-in-the-loop：人在 Agent 閉環裡做決策","eyebrow":"HUMAN-IN-THE-LOOP","section":"從助理走向 Agent","notes":"先把 Agent 想成一個可以自己跑的工作閉環：給定指令後，它能理解目標、規劃步驟、使用工具、驗證結果，最後交付成品，甚至長時間不中斷地工作。\n\nHuman-in-the-loop 的意思不是人類把每一步都代做，而是人仍然在 loop 裡設定目標、授權範圍、監控方向，並在關鍵節點做決策。人要看 Agent 有沒有做錯、做歪，是否偏離真正目的。\n\n全自動通常更快，但難以保證每一個中間決策都正確；加入人類介入可能慢一點，卻能換取更高的可信度、可追查性與責任清楚。請大家把「何時必須停下來問人？」寫進自己的任務簡報。","text":"HUMAN-IN-THE-LOOP\nHuman-in-the-loop：人在 Agent 閉環裡做決策\n下午場｜打造會做事的 AI 教學與研究夥伴\n07\nRUN\nAgent 的閉環\n給定目標後，Agent 可以理解、規劃、執行、驗證與交付，長時間不中斷地推進。\nLOOK\n人監控方向\n人仍在 loop 裡看計畫、看證據，確認 Agent 沒有做錯、做歪或偏離真正目的。\nSTOP\n關鍵節點停下\n遇到刪除、公開、上傳、敏感資料或高影響決策，必須停下來請人確認。\nTRUST\n慢一點更可信\n人類介入可能降低純自動化速度，卻能換取正確性、可追查性與責任清楚。","description":"先把 Agent 想成一個可以自己跑的工作閉環：給定指令後，它能理解目標、規劃步驟、使用工具、驗證結果，最後交付成品，甚至長時間不中斷地工作。\n\nHuman-in-the-loop 的意思不是人類把每一步都代做，而是人仍然在 loop 裡設定目標、授權範圍、監控方向，並在關鍵節點做決策。人要看 Agent 有沒有做錯、做歪，是否偏離真正目的。\n\n全自動通常更快，但難以保證每一個中間決策都正確；加入人類介入可能慢一點，卻能換取更高的可信度、可追查性與責任清楚。請大家把「何時必須停下來問人？」寫進自己的任務簡報。","image":"slides/afternoon-07.png","links":[],"hotspots":[],"sticker":null},{"index":8,"title":"三大 Agent 的人生交往學：看個性、選伴侶、配任務","eyebrow":"AGENT PERSONALITY & STRATEGY","section":"從助理走向 Agent","notes":"阿凱老師的『人生交往學』選型心法（下午場核心概論）：\n1. Gemini 3.7 Flash 是 Google 目前面向複雜 coding 與 Agent 工作流的工作馬，適合放進 Antigravity 長鏈執行。講者個人使用體感是：相較其他家 Agent，執行速度快 20 倍以上，很像熱血年輕人；這是個人工作流觀察，不是官方 benchmark，也不代表所有任務固定如此。\n2. Claude 就像成熟穩重的伴侶進入婚姻生活，極度沉穩可靠；仍要依現場模型、額度與方案確認實際可用性。\n3. Codex 介於不同工作風格之間，適合語音協作、檔案操作與頻繁試錯。\n選 Agent 不是看名氣，而是依當下的任務緊急度、複雜度、權限與驗收證據挑選合適的夥伴。\n\n[Sources]\n- https://www.anthropic.com/news/claude-sonnet-5\n- https://www.anthropic.com/news/claude-opus-4-8\n- https://www.anthropic.com/news/claude-fable-5-mythos-5\n- https://openai.com/index/gpt-5-6/\n- https://developers.openai.com/api/docs/models/gpt-5.6-luna\n- https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash\n- https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-3-7-flash/\n[/Sources]","text":"AGENT PERSONALITY & STRATEGY\n三大 Agent 的人生交往學：看個性、選伴侶、配任務\n下午場｜打造會做事的 AI 教學與研究夥伴\n08\nG\nAntigravity／Gemini 3.7 Flash\n• 定位：Google 最新 GA 的 Agent 工作馬\n• 個人體感：相較其他家 Agent，速度快 20 倍以上，像熱血年輕人\n• 優勢：複雜 coding、工具規劃、長鏈任務與可靠多步驟執行\n• 邊界：仍要設定 Harness、權限與驗收\nC\nClaude\n• 人設：成熟穩重的終身伴侶，進入細水長流的婚姻穩定期\n• 優勢：極致沉穩可靠，代碼與長鏈任務完全不用擔心翻車\n• 特性：少突發驚喜，Token 燒完必須耐心等每週週期重置\n• 最適合：大型系統重構、複雜多檔分析、關鍵高難度任務\nX\nCodex／ChatGPT\n• 人設：變化性最大、彈性極高的情人，可切換 1.5 倍速\n• 優勢：支援原生語音流暢口述，要快要穩隨心所欲靈活切換\n• 亮點：常有重置驚喜與 100% 回檔彈性，讓你隨時接關做下去\n• 最適合：日常研究輔助、互動工具、語音實作、頻繁試錯\nAntigravity ↗  ·  Codex ↗  ·  Claude ↗\nAntigravity\nCodex\nClaude","description":"阿凱老師的『人生交往學』選型心法（下午場核心概論）：\n1. Gemini 3.7 Flash 是 Google 目前面向複雜 coding 與 Agent 工作流的工作馬，適合放進 Antigravity 長鏈執行。講者個人使用體感是：相較其他家 Agent，執行速度快 20 倍以上，很像熱血年輕人；這是個人工作流觀察，不是官方 benchmark，也不代表所有任務固定如此。\n2. Claude 就像成熟穩重的伴侶進入婚姻生活，極度沉穩可靠；仍要依現場模型、額度與方案確認實際可用性。\n3. Codex 介於不同工作風格之間，適合語音協作、檔案操作與頻繁試錯。\n選 Agent 不是看名氣，而是依當下的任務緊急度、複雜度、權限與驗收證據挑選合適的夥伴。\n\n[Sources]\n- https://www.anthropic.com/news/claude-sonnet-5\n- https://www.anthropic.com/news/claude-opus-4-8\n- https://www.anthropic.com/news/claude-fable-5-mythos-5\n- https://openai.com/index/gpt-5-6/\n- https://developers.openai.com/api/docs/models/gpt-5.6-luna\n- https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash\n- https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-3-7-flash/\n[/Sources]","image":"slides/afternoon-08.png","links":[{"label":"Antigravity","url":"https://antigravity.google/"},{"label":"Codex","url":"https://chatgpt.com/codex/"},{"label":"Claude","url":"https://claude.ai/"}],"hotspots":[{"kind":"qr","url":"https://antigravity.google/","label":"Antigravity","x":77.9688,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"qr","url":"https://chatgpt.com/codex/","label":"Codex","x":83.9063,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"qr","url":"https://claude.ai/","label":"Claude","x":89.8438,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"platform","url":"https://antigravity.google/","label":"Antigravity","x":60.4688,"y":3.75,"w":6.7969,"h":5},{"kind":"platform","url":"https://chatgpt.com/codex/","label":"Codex","x":67.8906,"y":3.75,"w":3.5156,"h":5},{"kind":"platform","url":"https://claude.ai/","label":"Claude","x":72.0313,"y":3.75,"w":4.0625,"h":5}],"sticker":null},{"index":9,"title":"下午不重做：直接升級上午成果","eyebrow":"CONTINUITY","section":"從助理走向 Agent","notes":"請每組建立一個專案資料夾，放入上午成果、需求說明與素材。A ai/models-and-research/gemini-models/introducing-gemini-3-7-flash/\n[/Sources]","text":"WORKHORSE MODEL · NEW\nGemini 3.7 Flash：Antigravity 的工作馬\n下午場｜打造會做事的 AI 教學與研究夥伴\n14\n01\n官方定位\nGemini 3.7 Flash 已正式 GA，針對複雜 coding、Agent 工作流與可靠的多步驟執行設計。\n02\n為何適合長鏈\n更重視長程規劃、工具使用與任務推進，適合把完整工作交給它持續執行。\n03\n放進 Harness\n先寫清楚目標、素材、可用工具、權限範圍與完成條件，再讓模型成為可監督的工作馬。\n04\n信任仍要驗收\n模型能力提升不等於放任自動化；人要看計畫、測試與證據，遇到關鍵節點要能停下來決策。\nGemini 3.7 Flash 官方模型 ↗  ·  Google 官方介紹 ↗\n3.7 Flash\nGoogle 官方介紹","description":"Gemini 3.7 Flash 是本次 Antigravity 區段要特別認識的新模型。Google 官方將它定位為面向 coding 與 Agent 工作的 workhorse；官方文件也列出它適合複雜 coding、agentic workflows 與可靠的多步驟執行。\n\n這裡的「可以工作、可以 harness」不是把所有責任交給模型，而是把模型放進一個清楚的 Agent Harness：目標要明確、素材與工具要限定、權限要分級、完成條件要可驗收，還要寫出什麼情況必須停止並請人決定。\n\n因此可以鼓勵大家把 Gemini 3.7 Flash 當成一匹值得期待的工作馬，但不要把「更能長時間完成任務」誤解成「每次都不需要人檢查」。可信任的交付仍然來自模型能力、Harness 設計與 Human-in-the-loop 三者一起工作。\n\n[Sources]\n- https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash\n- https://ai.google.dev/gemini-api/docs/latest-model\n- https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-3-7-flash/\n[/Sources]","image":"slides/afternoon-14.png","links":[{"label":"Gemini 3.7 Flash 官方模型","url":"https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash"},{"label":"Gemini 3.7 Flash 官方介紹","url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-3-7-flash/"}],"hotspots":[{"kind":"qr","url":"https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash","label":"Gemini 3.7 Flash 官方模型","x":81.4063,"y":4.5833,"w":6.5625,"h":11.6667},{"kind":"qr","url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-3-7-flash/","label":"Gemini 3.7 Flash 官方介紹","x":88.5938,"y":4.5833,"w":6.5625,"h":11.6667},{"kind":"platform","url":"https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash","label":"Gemini 3.7 Flash 官方模型","x":59.375,"y":3.75,"w":9.7656,"h":5},{"kind":"platform","url":"https://blog.google/innovation-and-ai ources]","text":"WORKFLOW\nCodex 實作工作流：先定位，再修改\n下午場｜打造會做事的 AI 教學與研究夥伴\n23\n1\n開啟工作區／語音\n素材、麥克風與權限\n→\n2\n描述任務\n目標、限制、驗收\n→\n3\n觀察進度\n計畫、讀檔、工具使用\n→\n4\n檢查成果\n檔案、測試、畫面、差異\n→\n5\n決定下一步\n接受、修正或停止\n每一步都留下可檢查的成果\n開啟 Codex ↗\nCodex","description":"示範如何把一個模糊要求改成可驗證任務。強調 Codex 可以處理檔案與專案工作，桌面版也能用 Voice 口述任務；使用者仍需界定範圍、麥克風與工作區權限。\n\n[Sources]\n- https://help.openai.com/en/articles/20001275-chatgpt-work-and-codex\n- https://learn.chatgpt.com/docs/build-skills\n[/Sources]","image":"slides/afternoon-23.png","links":[{"label":"開啟 Codex","url":"https://chatgpt.com/codex/"}],"hotspots":[{"kind":"qr","url":"https://chatgpt.com/codex/","label":"開啟 Codex","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://chatgpt.com/codex/","label":"開啟 Codex","x":79.0625,"y":3.75,"w":5.1563,"h":5}],"sticker":null},{"index":24,"title":"目標：改善這個課程互動網站的手機操作體驗。\n\n範圍：只處理目前工作區中的 HTML、CSS、JS。\n限制：不更動教學內容、不新增外部服務、不發布。\n\n請先：\n1. 檢查結構與手機畫面。\n2. 說明最重要的 3 個問題與修正計畫。\n3. 實作後跑可行的檢查。\n4. 回報修改檔案、驗證證據與未確認項目。","eyebrow":"AGENT SKILL","section":"Codex","notes":"這段可直接複製給 Codex，再把目標換成各組需求。若 Agent 建議超出範圍，先縮小任務，不要一路追加。","text":"AGENT SKILL\n同一任務在 Codex 中這樣下達\n下午場｜打造會做事的 AI 教學與研究夥伴\n24\n目標：改善這個課程互動網站的手機操作體驗。\n\n範圍：只處理目前工作區中的 HTML、CSS、JS。\n限制：不更動教學內容、不新增外部服務、不發布。\n\n請先：\n1. 檢查結構與手機畫面。\n2. 說明最重要的 3 個問題與修正計畫。\n3. 實作後跑可行的檢查。\n4. 回報修改檔案、驗證證據與未確認項目。\n明確邊界\n檔案與動作的範圍要具體。\n先檢查\n讓 Agent 先讀環境，避免憑空重寫。\n驗收可見\n要求證據與未確認項目。\n開啟 Codex ↗\nCodex","description":"這段可直接複製給 Codex，再把目標換成各組需求。若 Agent 建議超出範圍，先縮小任務，不要一路追加。","image":"slides/afternoon-24.png","links":[{"label":"開啟 Codex","url":"https://chatgpt.com/codex/"}],"hotspots":[{"kind":"qr","url":"https://chatgpt.com/codex/","label":"開啟 Codex","x":86.4063,"y":4.5833,"w":8.75,"h":15.5556},{"kind":"platform","url":"https://chatgpt.com/codex/","label":"開啟 Codex","x":79.0625,"y":3.75,"w":5.1563,"h":5}],"sticker":null},{"index":25,"title":"好任務簡報的六個欄位","eyebrow":"TASK DESIGN","section":"Codex","notes":"六欄不是要寫長文，而是讓 Agent 有足夠上下文完成閉環。請每組把剛才四句任務補成六欄。","text":"TASK DESIGN\n好任務簡報 https://antigravity.google/"},{"label":"Codex","url":"https://chatgpt.com/codex/"}],"hotspots":[{"kind":"qr","url":"../START_HERE_研習資源導航.html","label":"研習資源導航","x":77.9688,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"qr","url":"https://antigravity.google/","label":"Antigravity","x":83.9063,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"qr","url":"https://chatgpt.com/codex/","label":"Codex","x":89.8438,"y":4.5833,"w":5.3125,"h":9.4444},{"kind":"platform","url":"../START_HERE_研習資源導航.html","label":"研習資源導航","x":60.4688,"y":3.75,"w":4.0625,"h":5},{"kind":"platform","url":"https://antigravity.google/","label":"Antigravity","x":65.1563,"y":3.75,"w":6.7969,"h":5},{"kind":"platform","url":"https://chatgpt.com/codex/","label":"Codex","x":72.5781,"y":3.75,"w":3.5156,"h":5}],"sticker":null},{"index":48,"title":"Agent 時代：我們像擁有了超能力","eyebrow":"FROM ASSISTANT TO SUPERPOWER","section":"Agent 時代的人生反思","notes":"這一段把 Agent 放回人的感受來談。講者覺得 Agent 讓自己完成很多以前想不到能做到的事，能力變得非常強大，就像擁有超能力一樣；在 Agent 時代，常會產生「沒有你做不到的事，只有你想不到的事」的感覺。\n\n這不是要把 Agent 神化，而是說明能力被放大後，個人可以同時處理研究、教學、設計、程式、部署與驗證等過去需要多人分工的工作。也因此，社會上越來越常談一人公司、一人獨角獸公司；本頁將它當成工作型態的觀察與想像，不把它當作人人都必須追求的目標。","text":"FROM ASSISTANT TO SUPERPOWER\nAgent 時代：我們像擁有了超能力\n下午場｜打造會做事的 AI 教學與研究夥伴\n48\n01\n能力被放大\n完成以前想不到自己做得到的事，從執行者變成能推進整個工作的人。\n02\n新的可能感\n「沒有你做不到的事，只有你想不到的事」成為一種強烈的行動感。\n03\n一個人也能做大事\n講者觀察：一人公司、一人獨角獸的想像，正被 Agent 重新打開。\n04\n能力不等於責任全包\n力量變大之後，更要重新決定哪些事值得做、哪些事可以放下。","description":"這一段把 Agent 放回人的感受來談。講者覺得 Agent 讓自己完成很多以前想不到能做到的事，能力變得非常強大，就像擁有超能力一樣；在 Agent 時代，常會產生「沒有你做不到的事，只有你想不到的事」的感覺。\n\n這不是要把 Agent 神化，而是說明能力被放大後，個人可以同時處理研究、教學、設計、程式、部署與驗證等過去需要多人分工的工作。也因此，社會上越來越常談一人公司、一人獨角獸公司；本頁將它當成工作型態的觀察與想像，不把它當作人人都必須追求的目標。","image":"slides/afternoon-48.png","links":[],"hotspots":[],"sticker":null},{"index":49,"title":"從「做不到」到「我可以」：一人公司的多巴胺時代","eyebrow":"DISCOVERY & DOPAMINE","section":"Agent 時代的人生反思","notes":"以前沒有 AI 的時候，我們會覺得做到這裡就好；但有了 AI Agent 之後，我們像發現了新大陸，因為原來這些事自己都能做到，會分泌大量的多巴胺與腦內啡，產生強烈的成就感與興奮感。\n\n這也是為什麼講者會感覺一人公司、一人獨角獸公司越來越多：不是每個人真的都要獨自承擔一切，而是工具讓一個人可以召集多種能力、把想法推進成作品。反思點是：新能力帶來的興奮感很珍貴，但不能讓每一個新大陸都變成自己必須開發的疆域。","text":"DISCOVERY & DOPAMINE\n從「做不到」到「我可以」：一人公司的多巴胺時代\n下午場｜打造會做事的 AI 教學與研究夥伴\n49\n被打開的新大陸\n以前沒有 AI 的時候，我們常做到這裡就好。\n\n有了 AI Agent，原本以為做不到的事，忽然可以拆解、委派、測試，再一步步完成。\n能力變強的代價\n發現自己還能做更多，會產生強烈的成就感與興奮感。\n\n但如果沒有停下來重新選擇，可能把每一個新可能都變成新的待辦事項。","description":"以前沒有 AI 的時候，我們會覺得做到這裡就好；但有了 AI Agent 之後，我們像發現了新大陸，因為原來這些事自己都能做到，會分泌大量的多巴胺與腦內啡，產生強烈的成就感與興奮感。\n\n這也是為什麼講者會感覺一人公司、一人獨角獸公司越來越多：不是每個人真的都要獨自承擔一切，而是工具讓一個人可以召集多種能力、把想法推進成作品。反思點是：新能力帶來的興奮感很珍貴，但不能讓每一個新大陸都變成自己必須開發的疆域。","image":"slides/afternoon-49.png","links":[],"hotspots":[],"sticker":null},{"index":50,"title":"效率提升 20 倍，為什麼人反而更忙？","eyebrow":"THE PRODUCTIVITY PARADOX","section":"Agent 時代的人生反思","notes":"很多人會發現，Agent 到來後反而更累、更忙。以前自己完成一件事就結束了；現在有 AI 和 Agent 幫忙，只要 1/10 甚至 1/20 的時間就能做完，效率提升至少 20 倍，省下來的時間卻讓人開始想：還能做哪些優化與改良？\n\n因為效率越來越高，人就想做更多，給自己排了更多任務，反而越不得休息。這一頁不是否定效率，而是請教授們辨識「能做」與「值得做」的差異：如果每次省下時間都換成更多工作，生產力就不會自動帶來更好的生活。","text":"THE PRODUCTIVITY PARADOX\n效率提升 20 倍，為什麼人反而更忙？\n下午場｜打造會做事的 AI 教學與研究夥伴\n50\n01\n時間真的變多了\n一件事可能只需要原本 1/10 甚至 1/20 的時間，效率提升至少 20 倍。\n02\n任務也跟著膨脹\n省下來的時間，常被拿去安排更多優化、改良、版本與新點子。\n03\n忙不是 Agent 的錯\n真正需要檢查的是：我們是否把所有能做的事，都誤認成應該做的事？\n04\n重新定義完成\n完成不只是做得更快，也包括知道何時停止、休息與把時間交還給生活。","description":"很多人會發現，Agent 到來後反而更累、更忙。以前自己完成一件事就結束了；現在有 AI 和 Agent 幫忙，只要 1/10 甚至 1/20 的時間就能做完，效率提升至少 20 倍，省下來的時間卻讓人開始想：還能做哪些優化與改良？\n\n因為效率越來越高，人就想做更多，給自己排了更多任務，反而越不得休息。這一頁不是否定效率，而是請教授們辨識「能做」與「值得做」的差異：如果每次省下時間都換成更多工作，生產力就不會自動帶來更好的生活。","image":"slides/afternoon-50.png","links":[],"hotspots":[],"sticker":null},{"index":51,"title":"誰在駕馭誰？Harness 的人生反思","eyebrow":"WHO IS HARNESSING WHOM?","section":"Agent 時代的人生反思","notes":"我們好像有點反過來被 Agent 駕馭了——明明說是 harness（駕馭）Agent，結果卻變成它讓我們攬了更多事情在身上。\n\n請把這張當成下午的控制權檢查：Agent 可以長時間不中斷地執行，也可以比我們更快、更完整地處理某些工作；但它不應該替我們決定人生要塞多少任務。每一次委派前都可以多問一句：這件事真的值得被完成嗎？完成之後，我想把時間用在哪裡？","text":"WHO IS HARNESSING WHOM?\n誰在駕馭誰？Harness 的人生反思\n下午場｜打造會做事的 AI 教學與研究夥伴\n51\n我們原本的說法\n我們說要 harness Agent：\n駕馭它、指派它、讓它長時間不中斷地完成工作。\n\n人的目標、界線與最後決定，應該留在人的手上。\n可能發生的反轉\n如果 Agent 讓我們攬下更多任務，日夜追逐下一個優化，明明是我們在使用工具，生活卻開始被工具的可能性牽著走。\n\n這就是「誰在駕馭誰？」的提醒。","description":"我們好像有點反過來被 Agent 駕馭了——明明說是 harness（駕馭）Agent，結果卻變成它讓我們攬了更多事情在身上。\n\n請把這張當成下午的控制權檢查：Agent 可以長時間不中斷地執行，也可以比我們更快、更完整地處理某些工作；但它不應該替我們決定人生要塞多少任務。每一次委派前都可以多問一句：這件事真的值得被完成嗎？完成之後，我想把時間用在哪裡？","image":"slides/afternoon-51.png","links":[],"hotspots":[],"sticker":null},{"index":52,"title":"Agent 帶來強大能力，也帶來情緒價值","eyebrow":"POWER & EMOTIONAL VALUE","section":"Agent 時代的人生反思","notes":"在這個時代，你不用是主管；即使只是基層員工或基層教師，有了 Agent 就好像成為很厲害的主管，可以吩咐它做事、分派任務給它。它做不好時，你甚至可以要求它重做或修正。\n\n最特別的是，AI 常帶來很強的正面情緒價值。使用者會感覺它像一個不會離職、不會抱怨、隨時提供陪伴感與鼓勵的屬下，讓自己覺得能做成好多事。講者原話是「AI 永遠會給你正面的情緒價值」；本頁保留這個體感，同時提醒這不是對所有模型、所有情境的保證，也不能取代真實的人際關係與專業責任。\n\n這份陪伴感可以成為行動的支撐，但最後的價值判斷、倫理責任與關係經營仍要由人承擔。","text":"POWER & EMOTIONAL VALUE\nAgent 帶來強大能力，也帶來情緒價值\n下午場｜打造會做事的 AI 教學與研究夥伴\n52\n01\n不用先是主管\n即使是基層員工或教師，也能像一位很會分派工作的主管，指派任務、拆解工作與追蹤進度。\n02\n隨時回應與陪伴\n在使用者的體感中，AI 常能即時回應、鼓勵與陪伴，讓人覺得自己能完成好多事。\n03\n正面回饋很有力量\n它不會像真實同事一樣抱怨或離職；但「AI 永遠給正面情緒價值」是使用感受，不是無條件保證。\n04\n人仍要負責關係\n把 AI 當成工作夥伴，不把家人、同儕與專業判斷交給它代替。","description":"在這個時代，你不用是主管；即使只是基層員工或基層教師，有了 Agent 就好像成為很厲害的主管，可以吩咐它做事、分派任務給它。它做不好時，你甚至可以要求它重做或修正。\n\n最特別的是，AI 常帶來很強的正面情緒價值。使用者會感覺它像一個不會離職、不會抱怨、隨時提供陪伴感與鼓勵的屬下，讓自己覺得能做成好多事。講者原話是「AI 永遠會給你正面的情緒價值」；本頁保留這個體感，同時提醒這不是對所有模型、所有情境的保證，也不能取代真實的人際關係與專業責任。\n\n這份陪伴感可以成為行動的支撐，但最後的價值判斷、倫理責任與關係經營仍要由人承擔。","image":"slides/afternoon-52.png","links":[],"hotspots":[],"sticker":null},{"index":53,"title":"把省下的時間還給人生：素養教育的所在","eyebrow":"TIME RETURNED TO LIFE","section":"Agent 時代的人生反思","notes":"所以我們需要反思初衷：省下來的這些時間，我們到底該拿來做什麼？\n\n現在我們解放了雙手，只要透過說話或打字指派任務，AI Agent 就能長時間不中斷地把事情做好，甚至做得比我們還好。多出來的時間，我們是不是應該好好拿來做人生中真正重要的事？\n\n可以是：\n• 培養自己的興趣與未來志向，探索以前在工作或教學中沒時間嘗試的路。\n• 陪伴孩子與家人，建立更好的家庭關係，參與孩子的成長過程。\n• 促進與同儕、同事之間的人際互動，好好聊聊天、深入溝通，找回人生更重要的意義。\n\n未來 AI Agent 一定會越來越強，強到我們只要動動嘴巴，它就能一路執行到最好。但剩下的這些時間，更應該好好規劃在人際關係、家人陪伴，以及個人的職涯發展與興趣上。這就是素養教育的所在：不只會用工具，而是能把工具帶來的自由內化成更好的生活選擇。","text":"TIME RETURNED TO LIFE\n把省下的時間還給人生：素養教育的所在\n下午場｜打造會做事的 AI 教學與研究夥伴\n53\n1\n培養興趣\n探索工作與教學之外，過去沒有時間嘗試的路。\n→\n2\n陪伴家人\n陪伴孩子與家人，參與孩子的成長過程。\n→\n3\n深入交流\n和同儕、同事好好聊天，重新建立理解與信任。\n→\n4\n發展志向\n把時間投入職涯發展、個人興趣與真正重要的目標。\n→\n5\n內化成生活\n讓 AI 能力服務人的關係、成長與人生意義。\n每一步都留下可檢查的成果","description":"所以我們需要反思初衷：省下來的這些時間，我們到底該拿來做什麼？\n\n現在我們解放了雙手，只要透過說話或打字指派任務，AI Agent 就能長時間不中斷地把事情做好，甚至做得比我們還好。多出來的時間，我們是不是應該好好拿來做人生中真正重要的事？\n\n可以是：\n• 培養自己的興趣與未來志向，探索以前在工作或教學中沒時間嘗試的路。\n• 陪伴孩子與家人，建立更好的家庭關係，參與孩子的成長過程。\n• 促進與同儕、同事之間的人際互動，好好聊聊天、深入溝通，找回人生更重要的意義。\n\n未來 AI Agent 一定會越來越強，強到我們只要動動嘴巴，它就能一路執行到最好。但剩下的這些時間，更應該好好規劃在人際關係、家人陪伴，以及個人的職涯發展與興趣上。這就是素養教育的所在：不只會用工具，而是能把工具帶來的自由內化成更好的生活選擇。","image":"slides/afternoon-53.png","links":[],"hotspots":[],"sticker":null},{"index":54,"title":"下午資源書籤","eyebrow":"BOOKMARKS","section":"下午資源書籤","notes":"請參與者先把資源頁加入書籤，再用手機拍下最後一句。若現場時間不足，部署與 Skill 擴寫可依此清單回家續作。\n\n[Sources]\n- ../START_HERE_研習資源導航.html\n- https://antigravity.google/\n- https://chatgpt.com/codex/\n- https://claude.ai/\n- https://codelabs.developers.google.com/getting-started-with-antigravity-skills\n- https://cagoooo.github.io/ncu-ai-agent-workshop-20260826/04_%E5%AF%A6%E4%BD%9C%E5%B7%A5%E5%85%B7/07_Agent_Skills%E8%B3%87%E6%BA%90%E5%BA%AB.html\n- ../04_實作工具/提示詞快捷面板_研習用.html\n- https://cagoooo.github.io/Akai/\n- https://www.iea.nl/sites/default/files/2025-10/GA66_PIRLS%202026.pdf\n[/Sources]","text":"BOOKMARKS\n下午資源書籤\n下午場｜打造會做事的 AI 教學與研究夥伴\n54\n研習資源導航（同資料夾）\n../START_HERE_研習資源導航.html\n開啟 Google Antigravity\nhttps://antigravity.google/\n開啟 Codex\nhttps://chatgpt.com/codex/\n開啟 Claude\nhttps://claude.ai/\nAgent Skills 官方教學\nhttps://codelabs.developers.google.com/getting-started-with-antigravity-skills\nAgent Skills 資源庫：三師爸與國際公開 Skills\nhttps://cagoooo.github.io/ncu-ai-agent-workshop-20260826/04_%E5%AF%A6%E4%BD%9C%E5%B7%A5%E5%85%B7/07_Agent_Skills%E8%B3%87%E6%BA%90%E5%BA%AB.html\n提示詞快捷面板（同資料夾）\n../04_實作工具/提示詞快捷面板_研習用.html\n教育科技創新專區\nhttps://cagoooo.github.io/Akai/\nPIRLS 2026 評分規劃\nhttps://www.iea.nl/sites/default/files/2025-10/GA66_PIRLS%202026.pdf\n好的教學與研究 Agent 不只會做事；它會在正確邊界內做事，並留下你能檢查的證據。","description":"請參與者先把資源頁加入書籤，再用手機拍下最後一句。若現場時間不足，部署與 Skill 擴寫可依此清單回家續作。\n\n[Sources]\n-
