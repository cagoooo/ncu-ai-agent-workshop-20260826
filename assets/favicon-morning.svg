<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">上午場｜AI 教學與研究工作室</title>
  <desc id="desc">晨曦溫暖背景上的展開筆記、語音波束與智慧星芒</desc>
  <defs>
    <linearGradient id="bgMorning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F3EC"/>
      <stop offset="100%" stop-color="#E8F1FC"/>
    </linearGradient>
    <linearGradient id="glowMorning" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22AFA4"/>
      <stop offset="50%" stop-color="#256FE8"/>
      <stop offset="100%" stop-color="#FF7866"/>
    </linearGradient>
    <linearGradient id="starMorning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9671"/>
      <stop offset="100%" stop-color="#FF6F59"/>
    </linearGradient>
    <filter id="shadowMorning" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#256FE8" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgMorning)" stroke="#CDD3DB" stroke-width="6"/>
  <!-- 展開的筆記本基座 -->
  <g filter="url(#shadowMorning)">
    <path d="M120 376 C190 350 240 356 256 376 C272 356 322 350 392 376 L392 206 C322 180 272 186 256 206 C240 186 190 180 120 206 Z" fill="#FFFFFF" stroke="#256FE8" stroke-width="12" stroke-linejoin="round"/>
    <path d="M256 206 L256 376" stroke="#256FE8" stroke-width="10" stroke-linecap="round"/>
    <path d="M152 250 C186 238 214 240 232 250" stroke="#CDD3DB" stroke-width="8" stroke-linecap="round"/>
    <path d="M152 286 C186 274 214 276 232 286" stroke="#CDD3DB" stroke-width="8" stroke-linecap="round"/>
    <path d="M280 250 C298 240 326 238 360 250" stroke="#CDD3DB" stroke-width="8" stroke-linecap="round"/>
    <path d="M280 286 C298 276 326 274 360 286" stroke="#CDD3DB" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- 晨曦向上躍升的能量光弧 (Typeless & Studio) -->
  <path d="M96 320 C180 300 230 160 380 130" fill="none" stroke="url(#glowMorning)" stroke-width="20" stroke-linecap="round" opacity="0.88"/>
  <!-- 靈感智慧四芒星 (Gemini Studio) -->
  <path d="M380 130 Q380 90 395 75 Q410 90 410 130 Q410 170 395 185 Q380 170 380 130 Z" fill="url(#starMorning)" transform="rotate(-15 395 130)" filter="url(#shadowMorning)"/>
  <circle cx="395" cy="130" r="14" fill="#FFFFFF"/>
  <circle cx="106" cy="324" r="12" fill="#22AFA4"/>
  <circle cx="216" cy="216" r="8" fill="#256FE8"/>
</svg>
