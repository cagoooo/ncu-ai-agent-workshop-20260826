<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">下午場｜會做事的 AI 教學與研究夥伴</title>
  <desc id="desc">深邃科技背景上的自律 Agent 運算晶片與三大性格交會能量環</desc>
  <defs>
    <linearGradient id="bgAfternoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B12"/>
      <stop offset="50%" stop-color="#07131F"/>
      <stop offset="100%" stop-color="#102438"/>
    </linearGradient>
    <linearGradient id="ringAfternoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55A7FF"/>
      <stop offset="50%" stop-color="#2CD2C7"/>
      <stop offset="100%" stop-color="#FF806D"/>
    </linearGradient>
    <linearGradient id="coreAfternoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#183654"/>
      <stop offset="100%" stop-color="#0A1826"/>
    </linearGradient>
    <filter id="glowAfternoon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgAfternoon)" stroke="#2A4761" stroke-width="6"/>
  
  <!-- 外環：Agent 自主閉環軌道 -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#16324A" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="url(#ringAfternoon)" stroke-width="16" stroke-linecap="round" filter="url(#glowAfternoon)" opacity="0.9"/>
  
  <!-- 核心運算晶片 (Agent Core) -->
  <polygon points="256,150 348,203 348,309 256,362 164,309 164,203" fill="url(#coreAfternoon)" stroke="#55A7FF" stroke-width="10" stroke-linejoin="round" filter="url(#glowAfternoon)"/>
  
  <!-- 內部互聯節點：三大 Agent 交往學節點 (Antigravity 閃電/Flash, Claude 穩固, Codex 彈性) -->
  <circle cx="256" cy="210" r="18" fill="#55A7FF" filter="url(#glowAfternoon)"/>
  <circle cx="212" cy="286" r="16" fill="#2CD2C7" filter="url(#glowAfternoon)"/>
  <circle cx="300" cy="286" r="16" fill="#FF806D" filter="url(#glowAfternoon)"/>
  <path d="M256 210 L212 286 L300 286 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  
  <!-- 頂部高光節點 -->
  <circle cx="256" cy="114" r="10" fill="#55A7FF"/>
  <circle cx="398" cy="256" r="10" fill="#FF806D"/>
  <circle cx="114" cy="256" r="10" fill="#2CD2C7"/>
</svg>
