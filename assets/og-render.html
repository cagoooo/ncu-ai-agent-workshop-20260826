<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    @font-face{font-family:"Noto Sans TC Local";src:local("Noto Sans TC")}
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07131f}
    .card{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff;font-family:"Noto Sans TC Local","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#07131f url("og-background.png") center/cover no-repeat}
    .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,14,27,.9) 0%,rgba(4,14,27,.76) 39%,rgba(4,14,27,.16) 73%,rgba(4,14,27,.05) 100%)}
    .content{position:absolute;left:58px;top:54px;width:730px}
    .eyebrow{display:inline-block;padding:8px 20px;border:1px solid rgba(85,167,255,.85);border-radius:22px;background:rgba(37,111,232,.78);font-size:20px;letter-spacing:.02em}
    h1{margin:48px 0 18px;font-size:56px;line-height:1.18;letter-spacing:.02em;font-weight:800;text-shadow:0 3px 16px rgba(0,0,0,.45)}
    .subtitle{margin:0;color:#d2efff;font-size:30px;line-height:1.4;font-weight:500}
    .topics{margin-top:28px;color:#9bd8ff;font-size:19px;letter-spacing:.01em}
    .date{display:inline-block;margin-top:47px;padding:10px 23px;border:2px solid #2cd2c7;border-radius:24px;background:rgba(16,36,56,.78);font-size:20px;font-weight:700}
    .footer{position:absolute;left:62px;bottom:53px;color:#ff806d;font-size:22px;font-weight:800}
  </style>
</head>
<body>
  <div class="card">
    <div class="veil"></div>
    <div class="content">
      <div class="eyebrow">NCU × 阿凱老師</div>
      <h1>從 AI 教學與研究助理<br>到 AI Agent</h1>
      <p class="subtitle">大學教師的生成式 AI 實作工作坊</p>
      <div class="topics">Gemini Notebook · Gem · Canvas · Antigravity · Codex · Agent Skills</div>
      <div class="date">2026.08.26｜國立中央大學</div>
    </div>
    <div class="footer">教學 × 研究 × AI Agent</div>
  </div>
</body>
</html>
