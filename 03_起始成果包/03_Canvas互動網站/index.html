<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>課堂理解檢核起始站</title><style>
:root{--ink:#14213d;--blue:#1769e0;--paper:#f7f3eb;--line:#d6deea}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--paper);line-height:1.65}.wrap{width:min(900px,calc(100% - 2rem));margin:auto}header{padding:1.5rem 0 2rem}h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05;margin:.5rem 0}.back-home{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;margin-top:1rem;padding:.55rem .85rem;border:1px solid #9eabba;border-radius:.7rem;background:#fff;color:var(--blue);text-decoration:none;font-weight:900}.back-home:hover{background:#edf4ff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.2rem;margin:1rem 0}label{display:block;font-weight:800;margin:.8rem 0 .3rem}textarea,select{width:100%;padding:.7rem;border:1px solid #9eabba;border-radius:.7rem;font:inherit}button{min-height:44px;padding:.65rem 1rem;border:0;border-radius:.7rem;background:var(--blue);color:#fff;font-weight:900;margin-top:1rem;cursor:pointer}.result{border-left:5px solid var(--blue);padding:1rem;background:#edf4ff;margin-top:1rem}.muted{color:#5d6878}button:focus-visible,.back-home:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffb703;outline-offset:3px}</style></head><body><main class="wrap"><a class="back-home" href="../../08_HTML簡報/index.html"><span aria-hidden="true">←</span><span>回到簡報主頁</span></a><header><div class="muted">CANVAS STARTER · 請直接修改</div><h1>共享花園<br>理解檢核</h1><p>這是一個不含外部套件的單檔起始網站。請用 Gemini Canvas、Antigravity 或 Codex 修改題目、回饋與視覺。</p></header><section class="card"><h2>閱讀後回答</h2><label for="choice">共享花園帶來哪兩類改變？</label><select id="choice"><option value="">請選擇</option><option value="a">只有景觀改善</option><option value="b">環境改善與社群關係改變</option><option value="c">只有蔬菜產量增加</option></select><label for="evidence">請寫下一段支持你判斷的文字證據</label><textarea id="evidence" rows="5" placeholder="我找到的證據是……"></textarea><button id="check">檢查並產生自我回饋</button><div id="result" class="result" hidden aria-live="polite"></div></section><section class="card"><h2>建議改版任務</h2><ol><li>加入第二題，但不要只用顏色顯示正誤。</li><li>限制空白送出，並提供友善錯誤訊息。</li><li>讓 320px 寬度仍可操作。</li><li>加入一個教師可修改的評量規準。</li></ol></section></main><script>document.querySelector('#check').addEventListener('click',()=>{const c=document.querySelector('#choice').value;const e=document.querySelector('#evidence').value.trim();const r=document.querySelector('#result');r.hidden=false;if(!c||!e){r.textContent='請先完成選擇並寫下文字證據。';return}const ok=c==='b';r.innerHTML=`<strong>${ok?'方向正確':'再回到文本找找看'}</strong><br>${ok?'你已辨識兩種改變。':'文本同時描述空間與人際互動。'} ${e.length<12?'你的證據較短，請再指出具體行動或結果。':'你已提供可檢查的文字證據。'}`})</script></body></html>
