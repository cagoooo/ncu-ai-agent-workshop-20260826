<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 完成證據打包器</title><link rel="stylesheet" href="../assets/workshop.css"><style>.preview{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;background:#111827;color:#edf4ff;max-height:42rem;overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}@media(max-width:900px){.two{grid-template-columns:1fr}}</style></head>
<body><a class="skip-link" href="#main">跳到主要內容</a><header class="topbar"><div class="brand">Agent Evidence Packager</div><nav><a href="#brief">任務</a><a href="#proof">證據</a><a href="#package">打包</a></nav></header>
<main id="main"><section class="hero wrap"><div class="eyebrow">P1-08 · Evidence over assertion</div><h1>不要只說完成。<br>把證據一起交付。</h1><p class="lead">將任務簡報、實際變更、測試、畫面、限制與下一步整理成可讀、可追溯的交接包。沒有證據的項目自動標示「未確認」。</p><div class="callout warn"><strong>上傳前先掃描：</strong>不要附上 API key、密碼、權杖、學生姓名、通知截圖或未公開研究資料。本工具只在本機瀏覽器處理附件。</div></section>
<section class="section wrap"><div class="two"><div>
<article class="card" id="brief"><h2>1. 任務契約</h2><label class="field"><span>任務名稱</span><input id="task" placeholder="例如：為 Canvas 作品加入作答結果匯出"></label><label class="field"><span>目標與對象</span><textarea id="goal" placeholder="誰要使用、要解決什麼問題……"></textarea></label><label class="field"><span>允許範圍</span><textarea id="scope" placeholder="可修改哪些檔案、不可做什麼……"></textarea></label><label class="field"><span>驗收條件（每行一項）</span><textarea id="criteria">主要流程可完成。
錯誤輸入有友善提示。
手機寬度可操作。
未包含敏感資訊。</textarea></label></article>
<article class="card" id="proof" style="margin-top:1rem"><h2>2. 結果與證據</h2><label class="field"><span>完成狀態</span><select id="status"><option value="已驗證完成">已驗證完成</option><option value="部分完成">部分完成</option><option value="未確認">未確認</option><option value="阻塞">阻塞</option></select></label><label class="field"><span>變更摘要</span><textarea id="changes" placeholder="修改了什麼，以及為什麼……"></textarea></label><label class="field"><span>測試與結果（每行一項）</span><textarea id="tests" placeholder="PASS｜手機 390px 可完成主要流程&#10;PASS｜空白送出顯示錯誤&#10;未確認｜中央大學現場網路"></textarea></label><label class="field"><span>已知限制與未確認</span><textarea id="limits" placeholder="尚未驗證、需要人工決定或外部權限的部分……"></textarea></label><label class="field"><span>下一步</span><textarea id="next" placeholder="可安全接續的下一個動作……"></textarea></label><label class="field"><span>附件（可多選）</span><input id="files" type="file" multiple></label><p class="hint" id="fileHint">尚未選擇附件。</p></article>
</div><div id="package"><article class="card" style="position:sticky;top:5rem"><h2>3. 交接報告預覽</h2><div id="checks" class="callout"></div><pre id="preview" class="card preview"></pre><div class="card-actions no-print"><button class="btn" id="refresh">更新預覽</button><button class="btn secondary" id="copy">複製 Markdown</button><button class="btn teal" id="downloadMd">下載 Markdown</button><button class="btn dark" id="downloadZip">下載完整 ZIP</button></div></article></div></div></section>
</main><footer><div class="wrap">完成狀態必須由證據支持；缺少測試或外部驗收時，請保留「未確認」。</div></footer><script src="../assets/common.js"></script><script>
const $=s=>document.querySelector(s);let attachments=[];
function lines(v){return v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}
function report(){const task=$('#task').value.trim()||'未命名 Agent 任務',goal=$('#goal').value.trim()||'未提供',scope=$('#scope').value.trim()||'未提供',criteria=lines($('#criteria').value),changes=$('#changes').value.trim()||'未提供',tests=lines($('#tests').value),limits=$('#limits').value.trim()||'未提供',next=$('#next').value.trim()||'未提供',status=$('#status').value;const evidenceOk=tests.some(x=>/PASS|通過|成功|已驗證/i.test(x));const hasChanges=$('#changes').value.trim().length>10;const hasCriteria=criteria.length>=2;const verified=status==='已驗證完成'&&evidenceOk&&hasChanges&&hasCriteria;const effective=status==='已驗證完成'&&!verified?'未確認（完成聲明缺少足夠證據）':status;const md=`# Agent 任務交接報告\n\n- 任務：${task}\n- 狀態：${effective}\n- 產生時間：${new Date().toLocaleString('zh-TW')}\n\n## 目標與對象\n\n${goal}\n\n## 授權範圍\n\n${scope}\n\n## 驗收條件\n\n${criteria.length?criteria.map(x=>`- [ ] ${x}`).join('\n'):'- [ ] 未提供'}\n\n## 變更摘要\n\n${changes}\n\n## 測試與證據\n\n${tests.length?tests.map(x=>`- ${x}`).join('\n'):'- 未確認：尚未提供測試結果'}\n\n## 附件清單\n\n${attachments.length?attachments.map(f=>`- attachments/${f.name}`).join('\n'):'- 無附件'}\n\n## 已知限制與未確認\n\n${limits}\n\n## 下一步\n\n${next}\n\n## 人工覆核\n\n- [ ] 我已檢查附件不含密碼、API key、權杖、學生個資或未公開敏感資料。\n- [ ] 我已實際閱讀測試證據，完成狀態不是只根據 Agent 自述。\n`;$('#preview').textContent=md;const checks=[[hasCriteria,'至少兩項驗收條件'],[hasChanges,'具體變更摘要'],[evidenceOk,'至少一項通過證據'],[attachments.length>0,'至少一個附件（建議）']];$('#checks').className=`callout ${verified?'safe':status==='已驗證完成'?'danger':'warn'}`;$('#checks').innerHTML=`<strong>${verified?'證據足以支援完成聲明':'仍有未確認或缺少證據'}</strong><br>${checks.map(([v,t])=>`${v?'✓':'△'} ${t}`).join('　')}`;return {md,task,effective,criteria,tests}}
$('#files').addEventListener('change',async e=>{attachments=[];for(const f of e.target.files)attachments.push({name:f.name,data:new Uint8Array(await f.arrayBuffer())});$('#fileHint').textContent=attachments.length?`已選擇 ${attachments.length} 個附件：${attachments.map(x=>x.name).join('、')}`:'尚未選擇附件。';report()});
['task','goal','scope','criteria','status','changes','tests','limits','next'].forEach(id=>$('#'+id).addEventListener('input',report));$('#refresh').addEventListener('click',report);$('#copy').addEventListener('click',()=>Workshop.copy(report().md,$('#copy')));$('#downloadMd').addEventListener('click',()=>{const r=report();Workshop.download(`${safe(r.task)}_交接報告.md`,r.md)});function safe(s){return s.replace(/[\\/:*?"<>|]+/g,'_').slice(0,60)||'Agent任務'}
$('#downloadZip').addEventListener('click',()=>{const r=report(),root=safe(r.task),meta={task:r.task,status:r.effective,created_at:new Date().toISOString(),criteria:r.criteria,tests:r.tests,attachments:attachments.map(x=>x.name)};const files={[`${root}/REPORT.md`]:r.md,[`${root}/evidence.json`]:JSON.stringify(meta,null,2),[`${root}/attachments/請先放入證據檔案.txt`]:'若本次未附檔，請在此放入前後畫面、測試紀錄、網址或其他可追溯證據。'};attachments.forEach(f=>files[`${root}/attachments/${f.name}`]=f.data);Workshop.download(`${root}_evidence.zip`,Workshop.zipStore(files),'application/zip')});report();
</script></body></html>
