<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示詞快捷面板</title>
<style>
  /* ─────────── 主題（4 種暖色，面板內可即時切換） ─────────── */
  :root, [data-theme="apricot"]{
    --paper:#FBF6EE; --card:#FFFDF9; --panel:#F4ECDE; --panel2:#FAF3E8;
    --ink:#3A332C; --sub:#8C7F6E; --faint:#B6A893;
    --line:#E8DDCC; --line2:#F0E8D9;
    --accent:#D98A52; --accent-deep:#C2723B; --accent-soft:#F7E9D7;
    --ok:#7FA45B; --danger:#C56B5B;
  }
  [data-theme="matcha"]{
    --paper:#F5F4EC; --card:#FFFEFA; --panel:#ECEDE0; --panel2:#F4F4EA;
    --ink:#353A2E; --sub:#7C8270; --faint:#A8AE94;
    --line:#E2E5D3; --line2:#EDEFE2;
    --accent:#8C9A5B; --accent-deep:#6E7C43; --accent-soft:#E7EBD9;
    --ok:#6E7C43; --danger:#C56B5B;
  }
  [data-theme="clay"]{
    --paper:#FAF3F1; --card:#FFFCFB; --panel:#F3E7E3; --panel2:#FAF1EE;
    --ink:#3E3331; --sub:#8A7B77; --faint:#BBA8A2;
    --line:#EBDAD5; --line2:#F4E9E5;
    --accent:#C77E6F; --accent-deep:#AE6456; --accent-soft:#F1E1DC;
    --ok:#8C9A5B; --danger:#B85B4E;
  }
  [data-theme="oat"]{
    --paper:#F8F5EF; --card:#FFFDF8; --panel:#EFE7D8; --panel2:#F6F0E5;
    --ink:#36312B; --sub:#857C6D; --faint:#B5A88F;
    --line:#E9DECC; --line2:#F2EBDC;
    --accent:#B98A57; --accent-deep:#9C6F3E; --accent-soft:#EFE5D4;
    --ok:#7FA45B; --danger:#C56B5B;
  }

  *{box-sizing:border-box; margin:0; padding:0}
  :root{
    --mono:"SFMono-Regular",ui-monospace,"Cascadia Code",Consolas,monospace;
    --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","微軟正黑體",system-ui,sans-serif;
  }
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; line-height:1.55; overflow:hidden;
  }
  svg.ic{width:1em; height:1em; stroke:currentColor; stroke-width:1.7; fill:none;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-.13em}
  button{font-family:inherit; cursor:pointer}
  ::selection{background:var(--accent-soft)}

  /* ─────────── App shell ─────────── */
  .app{display:flex; flex-direction:column; width:100%; height:100vh; max-width:2200px; margin:0 auto;
    border-left:1px solid var(--line); border-right:1px solid var(--line); background:var(--paper);
    box-shadow:0 0 36px rgba(92,66,35,.07)}

  /* Top bar */
  .topbar{display:flex; align-items:center; gap:18px; padding:16px clamp(22px,2.4vw,42px);
    border-bottom:1px solid var(--line); background:var(--card)}
  .brand{display:flex; align-items:center; gap:13px}
  .brand .logo{width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent-deep); font-size:22px}
  .brand .tt{font-size:20px; font-weight:800; letter-spacing:-.01em}
  .brand .tt small{display:block; font-size:12.5px; font-weight:600; color:var(--faint); letter-spacing:.02em}
  .spacer{flex:1}
  .themes{display:flex; gap:8px; align-items:center; margin-right:5px}
  .themes .sw{width:24px; height:24px; border-radius:50%; border:2px solid transparent;
    cursor:pointer; padding:0; outline:none; transition:transform .12s}
  .themes .sw:hover{transform:scale(1.12)}
  .themes .sw.on{border-color:var(--ink)}
  .tb-btn{display:inline-flex; align-items:center; gap:8px; font-size:14.5px; font-weight:600;
    color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:10px 15px; transition:background .12s, border-color .12s}
  .tb-btn:hover{background:var(--panel2); border-color:var(--faint)}
  .back-home{text-decoration:none;white-space:nowrap;color:var(--ink)}
  .tb-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .tb-btn.primary:hover{background:var(--accent-deep)}
  .tb-btn .ic{font-size:17px}
  .tb-icon{width:40px; height:40px; padding:0; justify-content:center}

  /* Search row */
  .searchrow{display:flex; align-items:center; gap:16px; padding:14px clamp(22px,2.4vw,42px) 15px;
    border-bottom:1px solid var(--line); background:var(--card)}
  .searchbox{flex:1; display:flex; align-items:center; gap:12px; background:var(--paper);
    border:1.5px solid var(--line); border-radius:12px; padding:0 16px; transition:border-color .15s, box-shadow .15s}
  .searchbox:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
  .searchbox .ic{font-size:20px; color:var(--accent)}
  #search{flex:1; border:none; outline:none; background:none; font-size:17px; color:var(--ink);
    padding:13px 0; font-family:inherit}
  #search::placeholder{color:var(--faint)}
  .kbd{font-family:var(--mono); font-size:12px; background:var(--card); border:1px solid var(--line);
    border-bottom-width:2px; border-radius:6px; padding:2px 7px; color:var(--sub)}
  .sortsel{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--sub); white-space:nowrap}
  .sortsel select{font-family:inherit; font-size:14px; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:10px 12px; cursor:pointer; outline:none}
  .auto-tab-label{display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600;
    color:var(--accent-deep); background:var(--accent-soft); padding:9px 13px; border-radius:9px;
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); cursor:pointer; user-select:none;
    transition:all .15s; white-space:nowrap}
  .auto-tab-label:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
  .auto-tab-label input{accent-color:var(--accent); cursor:pointer}

  /* Body 3-pane */
  .body{flex:1; display:flex; min-height:0; min-width:0}
  /* rail */
  .rail{width:224px; flex:none; border-right:1px solid var(--line); background:var(--panel);
    padding:18px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:3px}
  .rail .grp{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint);
    font-weight:700; padding:14px 11px 8px}
  .rail .grp:first-child{padding-top:2px}
  .ri{display:flex; align-items:center; gap:12px; padding:12px 12px; border-radius:10px;
    font-size:15px; color:var(--sub); font-weight:600; border:1px solid transparent; text-align:left;
    width:100%; background:none; transition:background .1s}
  .ri:hover{background:var(--panel2)}
  .ri .ic{font-size:19px; color:var(--faint)}
  .ri .ct{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--faint)}
  .ri.on{background:var(--card); color:var(--accent-deep); box-shadow:0 1px 4px rgba(90,60,20,.07)}
  .ri.on .ic{color:var(--accent-deep)}
  .ri.on .ct{color:var(--accent-deep)}

  /* list */
  .listcol{flex:1.05; min-width:0; border-right:1px solid var(--line); overflow-y:auto; background:var(--paper)}
  .listhead{display:flex; align-items:baseline; gap:10px; padding:18px 24px 10px; position:sticky; top:0;
    background:linear-gradient(var(--paper),var(--paper) 70%,transparent); z-index:2}
  .listhead .h{font-size:18px; font-weight:800}
  .listhead .c{font-size:13px; color:var(--faint); font-family:var(--mono)}
  .rows{padding:0 16px 24px}
  .row{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px;
    padding:14px 15px; border-radius:12px; border:1px solid transparent; cursor:pointer; position:relative}
  .row + .row{margin-top:1px}
  .row:hover{background:var(--card); border-color:var(--line)}
  .row.sel{background:var(--card); border-color:var(--accent); box-shadow:0 2px 10px rgba(120,80,30,.08)}
  .row.copied{animation:flash .85s cubic-bezier(.2,.9,.3,1)}
  @keyframes flash{0%{box-shadow:0 0 0 0 var(--ok); background:color-mix(in srgb,var(--ok) 14%,var(--card))}
    35%{box-shadow:0 0 0 3px var(--ok)}100%{box-shadow:0 0 0 0 transparent}}
  .rstar.pop{animation:pop .42s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
  .ub{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent-deep);
    background:var(--accent-soft); border-radius:5px; padding:0 5px; line-height:1.5; flex:none}
  mark.hl{background:color-mix(in srgb,var(--accent) 26%,transparent); color:inherit; border-radius:3px; padding:0 1px}
  .trig{font-family:var(--mono); font-weight:700; font-size:13px; color:#fff; background:var(--accent);
    padding:4px 10px; border-radius:7px; white-space:nowrap}
  .rmid{min-width:0}
  .rmid .nm{font-weight:700; font-size:16px; display:flex; align-items:center; gap:7px; min-width:0}
  .rmid .nm .nmt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .rmid .nm .cati{color:var(--faint); font-size:16px; flex:none}
  .rmid .pv{font-size:13.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
  .rstar{flex:none; width:32px; height:32px; border-radius:8px; display:grid; place-items:center;
    color:var(--faint); background:none; border:none; font-size:18px; opacity:.55; transition:.12s}
  .row:hover .rstar{opacity:1}
  .rstar:hover{background:var(--panel); color:var(--accent)}
  .rstar.on{color:var(--accent); opacity:1}
  .rstar.on .ic{fill:var(--accent)}

  /* preview */
  .pane{flex:1.25; min-width:0; overflow-y:auto; background:var(--card)}
  .pv-empty{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--faint); gap:12px; padding:40px; text-align:center}
  .pv-empty .big{font-size:34px; color:var(--line)}
  .pv-wrap{padding:34px clamp(34px,4vw,72px) 48px}
  .pv-top{display:flex; align-items:center; gap:13px; flex-wrap:wrap}
  .pv-top .trig{font-size:15px; padding:5px 13px}
  .pv-top .cati{display:inline-grid; place-items:center; width:36px; height:36px; border-radius:9px;
    background:var(--accent-soft); color:var(--accent-deep); font-size:20px}
  .pv-h1{font-size:30px; font-weight:800; letter-spacing:-.01em; margin:18px 0 10px; line-height:1.35}
  .pv-meta{display:flex; align-items:center; gap:18px; font-size:15px; color:var(--sub)}
  .pv-meta span{display:inline-flex; align-items:center; gap:5px}
  .pv-doc{margin-top:22px; background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:24px 26px; font-size:17px; color:#4d453a; line-height:1.9; white-space:pre-wrap;
    word-break:break-word; font-family:var(--sans)}
  .pv-actions{display:flex; align-items:center; gap:12px; margin-top:22px; flex-wrap:wrap}
  .big-copy{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff;
    border:none; font-weight:700; font-size:16px; padding:14px 24px; border-radius:12px;
    box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent); transition:.12s}
  .big-copy:hover{background:var(--accent-deep)}
  .big-copy .ic{font-size:19px}
  .ghost-btn{display:inline-flex; align-items:center; gap:7px; background:var(--card); color:var(--sub);
    border:1px solid var(--line); border-radius:10px; padding:12px 17px; font-size:14px; font-weight:600; transition:.12s}
  .ghost-btn:hover{border-color:var(--faint); color:var(--ink)}
  .ghost-btn.fav.on{color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft)}
  .ghost-btn.fav.on .ic{fill:var(--accent)}
  .ghost-btn.del:hover{color:var(--danger); border-color:var(--danger)}

  .empty{padding:54px 22px; text-align:center; color:var(--sub); font-size:14px; line-height:1.85}
  .empty .ill{width:64px; height:64px; margin:0 auto 14px; border-radius:18px; display:grid; place-items:center;
    background:var(--panel); color:var(--faint); font-size:30px}
  .empty b{color:var(--ink); font-weight:700}

  /* preview doc inline formatting */
  .pv-doc .mk{color:var(--accent-deep); font-weight:700; font-family:var(--mono)}
  .pv-doc .ph{background:var(--accent-soft); color:var(--accent-deep); font-weight:600;
    border-radius:5px; padding:0 4px; white-space:nowrap}
  .pv-doc a.lnk{color:var(--accent-deep); font-weight:600; text-decoration:none;
    border-bottom:1.5px solid var(--accent-soft); word-break:break-all}
  .pv-doc a.lnk:hover{border-bottom-color:var(--accent)}
  .pv-empty{animation:fadein .4s}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* copy-all success */
  .big-copy.done{background:var(--ok); box-shadow:0 6px 16px color-mix(in srgb,var(--ok) 40%,transparent)}

  /* mini stats pill */
  .stats{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub);
    font-weight:600; white-space:nowrap; padding:0 2px}
  .stats b{color:var(--ink); font-family:var(--mono); font-weight:700}
  .stats .sep{width:1px; height:13px; background:var(--line)}
  .stats .ic{color:var(--accent); font-size:13px}

  /* Toast */
  #toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(130px);
    background:var(--ink); color:#fff; font-size:14px; font-weight:600; padding:13px 22px; border-radius:12px;
    box-shadow:0 14px 40px rgba(0,0,0,.25); transition:transform .32s cubic-bezier(.2,1.2,.3,1); z-index:80;
    pointer-events:none; display:flex; align-items:center; gap:9px; max-width:90vw}
  #toast .ic{color:#fff; font-size:16px}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.ok{background:var(--ok)} #toast.err{background:var(--danger)}

  /* Modal */
  .scrim{position:fixed; inset:0; background:rgba(40,32,22,.42); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:90; padding:20px}
  .scrim.show{display:flex}
  .modal{background:var(--card); border:1px solid var(--line); border-radius:20px; width:560px; max-width:100%;
    max-height:90vh; overflow-y:auto; box-shadow:0 30px 80px rgba(60,40,20,.3)}
  .modal-h{display:flex; align-items:center; justify-content:space-between; padding:20px 24px 14px}
  .modal-h h3{font-size:18px; font-weight:800}
  .modal-x{width:34px; height:34px; border-radius:9px; border:none; background:var(--panel); color:var(--sub);
    display:grid; place-items:center; font-size:16px}
  .modal-x:hover{background:var(--line)}
  .form{padding:4px 24px 8px; display:flex; flex-direction:column; gap:16px}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:6px}
  .field label .req{color:var(--danger)}
  .field input, .field textarea, .field select{width:100%; font-family:inherit; font-size:14px; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; outline:none;
    transition:border-color .15s, box-shadow .15s}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
  .field .mono-in{font-family:var(--mono); font-weight:700}
  .field textarea{min-height:150px; resize:vertical; line-height:1.7}
  .field .hint{font-size:11.5px; color:var(--faint); margin-top:5px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .modal-f{display:flex; align-items:center; gap:10px; padding:16px 24px 22px}
  .modal-f .spacer{flex:1}
  .err-msg{color:var(--danger); font-size:12.5px; font-weight:600; margin-right:auto}

  /* hidden file input */
  #importFile{display:none}

  /* ─────────── RWD ─────────── */
  .mobtabs{display:none}
  @media(min-width:1440px){
    .rail{width:244px; padding-inline:18px}
    .listcol{flex:1.12}
    .pane{flex:1.48}
    .listhead{padding-inline:28px}
    .rows{padding-inline:20px}
    .pv-wrap{padding-inline:clamp(44px,4.5vw,88px)}
  }
  @media(max-width:980px){
    .pane{display:none}
    .listcol{border-right:none}
    .rail{width:210px}
  }
  @media(max-width:720px){
    body{overflow:auto}
    .app{height:auto; min-height:100vh; border-left:none; border-right:none; box-shadow:none}
    .topbar{flex-wrap:wrap; gap:10px; padding:12px 14px}
    .brand{gap:10px}
    .brand .logo{width:36px; height:36px; border-radius:10px; font-size:19px}
    .brand .tt{font-size:17px}
    .brand .tt small{font-size:11px}
    .tb-btn span.lbl{display:none}
    .tb-btn{padding:9px 11px}
    .themes .sw{width:21px; height:21px}
    .searchrow{flex-wrap:wrap; padding:11px 14px; gap:10px}
    .searchbox{min-width:100%}
    #search{font-size:16px; padding:12px 0}
    .sortsel{order:3; width:100%}
    .sortsel select{flex:1; font-size:14px}
    .auto-tab-label{font-size:13px; padding:8px 10px}
    .body{flex-direction:column}
    .rail{display:none}
    .mobtabs{display:flex; gap:7px; overflow-x:auto; padding:11px 14px; border-bottom:1px solid var(--line);
      background:var(--card); -webkit-overflow-scrolling:touch}
    .mobtabs::-webkit-scrollbar{display:none}
    .mtab{flex:none; display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600;
      color:var(--sub); background:var(--panel); border:none; border-radius:999px; padding:8px 14px; white-space:nowrap}
    .mtab .ic{font-size:15px}
    .mtab.on{background:var(--accent); color:#fff}
    .listcol{overflow:visible}
    .listhead{padding:15px 16px 9px}
    .listhead .h{font-size:17px}
    .rows{padding:0 10px 20px}
    .row{gap:10px; padding:12px 10px}
    .trig{font-size:12px; padding:4px 8px}
    .rmid .nm{font-size:14.5px}
    .rmid .pv{font-size:12.5px}
    .rstar{width:30px; height:30px}
  }
</style>
</head>

/* ─────────── 分類 → 圖示 / 順序 ─────────── */
const CAT_ICON = {"部署上線":"i-rocket","網站設計":"i-web","影音字幕":"i-film","圖像簡報":"i-image",
  "內容寫作":"i-pen","功能整合":"i-hub","技能文件":"i-book","開發流程":"i-term","常用片段":"i-pin"};
const CAT_ORDER = ["部署上線","網站設計","影音字幕","圖像簡報","內容寫作","功能整合","技能文件","開發流程","常用片段"];
const iconFor = c => CAT_ICON[c] || "i-spark";
const LS = {data:"pp_prompts_v1", fav:"pp_favs_v1", cnt:"pp_counts_v1", theme:"pp_theme_v1", sort:"pp_sort_v1"};

/* ─────────── State ─────────── */
let state = {
  prompts: [], favs:new Set(), counts:{},
  view:"fav", sort:"used", query:"", selected:null, editing:null,
};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ─────────── Persistence ─────────── */
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS.data));
    state.prompts = Array.isArray(d) && d.length ? d : structuredClone(BUILTIN);
  }catch(e){ state.prompts = structuredClone(BUILTIN); }
  try{ state.favs = new Set(JSON.parse(localStorage.getItem(LS.fav))||[]); }catch(e){}
  try{ state.counts = JSON.parse(localStorage.getItem(LS.cnt))||{}; }catch(e){}
  state.sort = localStorage.getItem(LS.sort) || "used";
  const th = localStorage.getItem(LS.theme); if(th) document.body.dataset.theme = th;
}
const saveData  = () => localStorage.setItem(LS.data, JSON.stringify(state.prompts));
const saveFav   = () => localStorage.setItem(LS.fav, JSON.stringify([...state.favs]));
const saveCnt   = () => localStorage.setItem(LS.cnt, JSON.stringify(state.counts));

/* ─────────── Copy ─────────── */
async function copyText(text){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  const ta=document.createElement("textarea"); ta.value=text;
  ta.style.cssText="position:fixed;top:-9999px;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); return ok;
}
let toastT;
function toast(msg, kind){
  const t=$("#toast"); t.className=""; if(kind) t.classList.add(kind);
  t.innerHTML = `<svg class="ic"><use href="#${kind==="err"?"i-x":"i-copy"}"/></svg>${esc(msg)}`;
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1900);
}
async function doCopy(p, rowEl){
  const ok = await copyText(p.content);
  if(ok){
    state.counts[p.trigger]=(state.counts[p.trigger]||0)+1; saveCnt();
    toast(`✓ 已複製「${p.name}」！正在切換至上一個程式並自動貼上`, "ok");
    if(rowEl){ rowEl.classList.add("copied"); setTimeout(()=>rowEl.classList.remove("copied"),800); }
    if(state.sort==="used") renderList();
    if(state.selected===p.trigger) renderPane();
  }else toast("複製失敗，請手動選取內容","err");
}

/* ─────────── Derived ─────────── */
function catCounts(){
  const m={}; state.prompts.forEach(p=>m[p.cat]=(m[p.cat]||0)+1); return m;
}
function visiblePrompts(){
  let list = state.prompts.slice();
  if(state.view==="fav") list=list.filter(p=>state.favs.has(p.trigger));
  else if(state.view!=="all") list=list.filter(p=>p.cat===state.view);
  const q=state.query.trim().toLowerCase();
  if(q) list=list.filter(p=>(p.name+p.trigger+p.content+p.cat).toLowerCase().includes(q));
  if(state.sort==="used"){ const ord=new Map(state.prompts.map((p,i)=>[p.trigger,i]));
    list.sort((a,b)=>((state.counts[b.trigger]||0)-(state.counts[a.trigger]||0))||(ord.get(a.trigger)-ord.get(b.trigger))); }
  else if(state.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));
  return list;
}
const firstLine = s => { const i=s.indexOf("\n"); return (i<0?s:s.slice(0,i)).trim(); };
function hi(text){
  let t=esc(text); const q=state.query.trim();
  if(q){ try{ const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); t=t.replace(re,'<mark class="hl">$1</mark>'); }catch(e){} }
  return t;
}
function fmtContent(raw){
  let h=esc(raw);
  h=h.replace(/(https?:\/\/[^\s）)】]+)/g,'<a class="lnk" href="$1" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/〔([^〕]*)〕/g,'<span class="ph">〔$1〕</span>');
  h=h.replace(/^(\s*)(\d+[.、])/gm,'$1<span class="mk">$2</span>');
  h=h.replace(/^(\s*)([・•])/gm,'$1<span class="mk">$2</span>');
  return h;
}
function updateStats(){
  const s=document.getElementById("stats");
  if(s) s.innerHTML=`共 <b>${state.prompts.length}</b> 筆<span class="sep"></span><svg class="ic"><use href="#i-star"/></svg><b>${state.favs.size}</b>`;
}

/* ─────────── Render: rail ─────────── */
function renderRail(){
  const cc=catCounts(), rail=$("#rail");
  let html = `<div class="grp">總覽</div>`;
  html += railItem("all","i-spark","全部",state.prompts.length);
  html += railItem("fav","i-star","我的最愛",state.favs.size);
  html += `<div class="grp">分類</div>`;
  CAT_ORDER.forEach(c=>{ if(cc[c]) html += railItem(c, iconFor(c), c, cc[c]); });
  Object.keys(cc).forEach(c=>{ if(!CAT_ORDER.includes(c)) html += railItem(c, iconFor(c), c, cc[c]); });
  rail.innerHTML = html;
  rail.querySelectorAll(".ri").forEach(el=>el.onclick=()=>{ state.view=el.dataset.v; renderAll(); });

  // mobile tabs
  const mt=$("#mobtabs");
  let mh = mtab("all","i-spark","全部")+mtab("fav","i-star","最愛");
  CAT_ORDER.forEach(c=>{ if(cc[c]) mh+=mtab(c, iconFor(c), c); });
  mt.innerHTML=mh;
  mt.querySelectorAll(".mtab").forEach(el=>el.onclick=()=>{ state.view=el.dataset.v; renderAll(); });
  updateStats();
}
const railItem=(v,ic,label,ct)=>`<button class="ri ${state.view===v?"on":""}" data-v="${esc(v)}">
  <svg class="ic"><use href="#${ic}"/></svg>${esc(label)}<span class="ct">${ct}</span></button>`;
const mtab=(v,ic,label)=>`<button class="mtab ${state.view===v?"on":""}" data-v="${esc(v)}">
  <svg class="ic"><use href="#${ic}"/></svg>${esc(label)}</button>`;

/* ─────────── Render: list ─────────── */
function renderList(){
  const list=visiblePrompts(), rows=$("#rows");
  const title = state.view==="all"?"全部" : state.view==="fav"?"我的最愛" : state.view;
  $("#listTitle").textContent=title;
  $("#listCount").textContent = `${list.length} 筆`+(state.query.trim()?`（篩選自 ${state.prompts.length}）`:"");
  if(!list.length){
    rows.innerHTML = `<div class="empty"><div class="ill"><svg class="ic" style="width:30px;height:30px"><use href="#${state.view==="fav"&&!state.query?"i-star":"i-search"}"/></svg></div>${state.view==="fav"&&!state.query?"<b>還沒有最愛</b><br>在清單右側點 ☆ 收藏常用提示詞":"<b>找不到符合的提示詞</b><br>換個關鍵字，或按 Esc 清空"}</div>`;
    return;
  }
  rows.innerHTML = list.map(p=>{
    const fav=state.favs.has(p.trigger);
    return `<div class="row ${state.selected===p.trigger?"sel":""}" data-t="${esc(p.trigger)}">
      <span class="trig">${esc(p.trigger)}</span>
      <div class="rmid">
        <div class="nm"><svg class="ic cati"><use href="#${iconFor(p.cat)}"/></svg><span class="nmt">${hi(p.name)}</span>${(state.counts[p.trigger]||0)>0?`<span class="ub">${state.counts[p.trigger]}</span>`:""}</div>
        <div class="pv">${hi(firstLine(p.content))}</div>
      </div>
      <button class="rstar ${fav?"on":""}" data-fav="${esc(p.trigger)}" title="${fav?"取消最愛":"加入最愛"}">
        <svg class="ic"><use href="#i-star"/></svg></button>
    </div>`;
  }).join("");
  rows.querySelectorAll(".row").forEach(el=>{
    const t=el.dataset.t, p=state.prompts.find(x=>x.trigger===t);
    el.onclick=()=>{ state.selected=t; renderPane(); markSel(); doCopy(p, el); };
  });
  rows.querySelectorAll(".rstar").forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation(); toggleFav(el.dataset.fav); };
  });
}
function markSel(){
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("sel", r.dataset.t===state.selected));
}
function toggleFav(t){
  const adding=!state.favs.has(t);
  if(adding) state.favs.add(t); else state.favs.delete(t);
  saveFav(); renderRail(); renderList(); if(state.selected===t) renderPane();
  if(adding){ const s=document.querySelector(`.rstar[data-fav="${cssEsc(t)}"]`);
    if(s){ s.classList.add("pop"); s.addEventListener("animationend",()=>s.classList.remove("pop"),{once:true}); } }
}

/* ─────────── Render: preview pane ─────────── */
function renderPane(){
  const pane=$("#pane");
  const p = state.prompts.find(x=>x.trigger===state.selected);
  if(!p){
    pane.innerHTML = `<div class="pv-empty"><svg class="ic big"><use href="#i-spark"/></svg>
      <div>從左邊清單點一張<br>就會在這裡看到完整內容</div></div>`;
    return;
  }
  const fav=state.favs.has(p.trigger), used=state.counts[p.trigger]||0;
  pane.innerHTML = `<div class="pv-wrap">
    <div class="pv-top">
      <span class="trig">${esc(p.trigger)}</span>
      <span class="cati"><svg class="ic"><use href="#${iconFor(p.cat)}"/></svg></span>
      <span style="font-size:13px;color:var(--sub);font-weight:600">${esc(p.cat)}</span>
    </div>
    <h1 class="pv-h1">${esc(p.name)}</h1>
    <div class="pv-meta">
      <span><svg class="ic"><use href="#i-clock"/></svg>已使用 ${used} 次</span>
      ${fav?'<span style="color:var(--accent-deep)"><svg class="ic" style="fill:var(--accent)"><use href="#i-star"/></svg>已收藏</span>':""}
    </div>
    <div class="pv-doc">${fmtContent(p.content)}</div>
    <div class="pv-actions">
      <button class="big-copy" id="pvCopy"><svg class="ic"><use href="#i-copy"/></svg>複製全文</button>
      <button class="ghost-btn fav ${fav?"on":""}" id="pvFav"><svg class="ic"><use href="#i-star"/></svg>${fav?"已收藏":"加入最愛"}</button>
      <button class="ghost-btn" id="pvEdit"><svg class="ic"><use href="#i-edit"/></svg>編輯</button>
      <button class="ghost-btn del" id="pvDel"><svg class="ic"><use href="#i-trash"/></svg>刪除</button>
    </div>
  </div>`;
  $("#pvCopy").onclick=async()=>{
    await doCopy(p, document.querySelector(`.row[data-t="${cssEsc(p.trigger)}"]`));
    const b=$("#pvCopy"); if(b){ b.classList.add("done"); b.innerHTML='<svg class="ic"><use href="#i-spark"/></svg>已複製！';
      setTimeout(()=>{ const nb=$("#pvCopy"); if(nb===b){ b.classList.remove("done"); b.innerHTML='<svg class="ic"><use href="#i-copy"/></svg>複製全文'; } },1300); }
  };
  $("#pvFav").onclick=()=>toggleFav(p.trigger);
  $("#pvEdit").onclick=()=>openEditor(p);
  $("#pvDel").onclick=()=>delPrompt(p.trigger);
}
const cssEsc = s => (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/[^a-zA-Z0-9_-]/g,"\\$&");

/* ─────────── Add / Edit / Delete ─────────── */
function openEditor(p){
  state.editing = p ? p.trigger : null;
  $("#modalTitle").textContent = p ? "編輯提示詞" : "新增提示詞";
  $("#f-trigger").value = p?p.trigger:"";
  $("#f-name").value = p?p.name:"";
  $("#f-cat").value = p?p.cat:"";
  $("#f-content").value = p?p.content:"";
  $("#formErr").textContent="";
  $("#modalDel").style.display = p ? "inline-flex" : "none";
  $("#catlist").innerHTML = CAT_ORDER.map(c=>`<option value="${esc(c)}">`).join("");
  $("#scrim").classList.add("show");
  setTimeout(()=>$("#f-trigger").focus(),50);
}
function closeEditor(){ $("#scrim").classList.remove("show"); state.editing=null; }
function saveEditor(){
  let trig=$("#f-trigger").value.trim(), name=$("#f-name").value.trim(),
      cat=$("#f-cat").value.trim(), content=$("#f-content").value;
  if(!trig||!name||!cat||!content.trim()){ $("#formErr").textContent="觸發詞、名稱、分類、內容都要填。"; return; }
  if(!trig.startsWith("/")) trig="/"+trig;
  const clash = state.prompts.find(p=>p.trigger===trig && p.trigger!==state.editing);
  if(clash){ $("#formErr").textContent=`觸發詞「${trig}」已存在，換一個。`; return; }
  if(state.editing){
    const i=state.prompts.findIndex(p=>p.trigger===state.editing);
    if(state.editing!==trig){ // trigger renamed → migrate fav/count
      if(state.favs.has(state.editing)){ state.favs.delete(state.editing); state.favs.add(trig); saveFav(); }
      if(state.counts[state.editing]!=null){ state.counts[trig]=state.counts[state.editing]; delete state.counts[state.editing]; saveCnt(); }
    }
    state.prompts[i]={trigger:trig,name,cat,content};
    state.selected=trig;
  }else{
    state.prompts.unshift({trigger:trig,name,cat,content});
    state.selected=trig;
  }
  saveData(); closeEditor(); renderAll(); toast(state.editing?"已更新":"已新增","ok");
}
function delPrompt(t){
  const p=state.prompts.find(x=>x.trigger===t); if(!p) return;
  if(!confirm(`確定刪除「${p.name}」(${t})？`)) return;
  state.prompts = state.prompts.filter(x=>x.trigger!==t);
  state.favs.delete(t); delete state.counts[t];
  if(state.selected===t) state.selected=null;
  saveData(); saveFav(); saveCnt(); closeEditor(); renderAll(); toast("已刪除","ok");
}

/* ─────────── Import / Export ─────────── */
function exportJSON(){
  const payload={ app:"提示詞快捷面板", version:1, exportedAt:new Date().toISOString(),
    prompts:state.prompts, favs:[...state.favs], counts:state.counts };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`提示詞備份_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(`已匯出 ${state.prompts.length} 筆`,"ok");
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const arr = Array.isArray(d) ? d : d.prompts;
      if(!Array.isArray(arr)) throw 0;
      const clean = arr.filter(p=>p&&p.trigger&&p.name&&p.cat&&p.content!=null)
        .map(p=>({trigger:String(p.trigger),name:String(p.name),cat:String(p.cat),content:String(p.content)}));
      if(!clean.length) throw 0;
      const mode = confirm(`匯入 ${clean.length} 筆。\n\n按「確定」= 合併（同觸發詞會被覆蓋）\n按「取消」= 整批取代目前全部`);
      if(mode){
        const map=new Map(state.prompts.map(p=>[p.trigger,p]));
        clean.forEach(p=>map.set(p.trigger,p));
        state.prompts=[...map.values()];
      }else state.prompts=clean;
      if(!Array.isArray(d)){
        if(Array.isArray(d.favs)) state.favs=new Set([...state.favs,...d.favs]);
        if(d.counts) state.counts=Object.assign(state.counts,d.counts);
      }
      saveData(); saveFav(); saveCnt(); renderAll(); toast(`已匯入 ${clean.length} 筆`,"ok");
    }catch(e){ toast("檔案格式不正確","err"); }
  };
  r.readAsText(file);
}
function resetDefaults(){
  if(!confirm("還原成內建的 48 個提示詞？\n你新增/編輯的內容會被覆蓋（最愛與使用次數保留）。")) return;
  state.prompts=structuredClone(BUILTIN); state.selected=null;
  saveData(); renderAll(); toast("已還原預設","ok");
}

/* ─────────── Theme ─────────── */
function setTheme(t){
  document.body.dataset.theme=t; localStorage.setItem(LS.theme,t);
  document.querySelectorAll(".themes .sw").forEach(s=>s.classList.toggle("on",s.dataset.theme===t));
}

/* ─────────── Render all ─────────── */
function renderAll(){ renderRail(); renderList(); renderPane(); }

/* ─────────── Wire up ─────────── */
load();
document.querySelector(`.themes .sw[data-theme="${document.body.dataset.theme}"]`)?.classList.add("on");
document.querySelectorAll(".themes .sw").forEach(s=>s.onclick=()=>setTheme(s.dataset.theme));
$("#sort").value=state.sort;
$("#sort").onchange=e=>{ state.sort=e.target.value; localStorage.setItem(LS.sort,state.sort); renderList(); };
$("#search").addEventListener("input",e=>{ state.query=e.target.value; renderList(); });
$("#search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const l=visiblePrompts(); if(l.length){ state.selected=l[0].trigger; renderPane(); markSel(); doCopy(l[0], document.querySelector(".row")); } }
  if(e.key==="Escape"){ e.target.value=""; state.query=""; renderList(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="/" && document.activeElement!==$("#search") && !$("#scrim").classList.contains("show")){
    e.preventDefault(); $("#search").focus(); $("#search").select();
  }
  if(e.key==="Escape" && $("#scrim").classList.contains("show")) closeEditor();
});
$("#btnAdd").onclick=()=>openEditor(null);
$("#btnExport").onclick=exportJSON;
$("#btnImport").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; };
$("#modalX").onclick=closeEditor;
$("#modalSave").onclick=saveEditor;
$("#modalDel").onclick=()=>{ if(state.editing) delPrompt(state.editing); };
$("#scrim").onclick=e=>{ if(e.target===$("#scrim")) closeEditor(); };
$("#f-content").addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter") saveEditor(); });

// 排序列加「還原預設」小鈕
(()=>{ const b=document.createElement("button"); b.className="tb-btn"; b.style.padding="9px 11px";
  b.title="還原成內建 48 筆"; b.innerHTML='<svg class="ic"><use href="#i-reset"/></svg>';
  b.onclick=resetDefaults; $(".sortsel").appendChild(b); })();

renderAll();
if(!state.selected){ const l=visiblePrompts(); if(l[0]){ state.selected=l[0].trigger; renderPane(); markSel(); } }
$("#search").focus();
</script>
</body>
</html>
